apiVersion: internal.odigos.io/v1beta1
kind: Status
metadata:
  name: added-to-collector-config
  ownerResource: action
  scope: cluster
  component: autoscaler
spec:
  type: 'AddedToCollectorConfig'

  docs:
    title: "Action Added to Collector Config"
    summary: "Technical status for odigosConfigExtension actions: whether their configuration was written into a collector ConfigMap."
    description: |
      This status applies only to actions that use the odigosConfigExtension config mechanism.
      Other action types do not set this condition.

      For those actions, Odigos includes processor configuration in a collector ConfigMap
      (cluster gateway or node collector).
      This condition reports only that the ConfigMap was updated to include the action,
      or that it was removed because the action is disabled.

      It is a technical status and is not a primary user-facing health signal.
      It does not mean the collector has reloaded or accepted the config, that the collector is running,
      that there are no collector errors, or that the action applies to every source.

    states:
    - state: "clusterGateway"
      summary: "Action configuration was written into or removed from the cluster gateway collector ConfigMap."
    - state: "nodeCollector"
      summary: "Action configuration was written into or removed from the node collector ConfigMap."

  reasons:

  - name: "ConfigUpdated"
    title: "Added to Collector Config"
    k8sConditionStatus: "True"
    odigosSeverity: "Success"
    summary: "This odigosConfigExtension action's configuration is present in a collector ConfigMap."
    description: |
      Odigos successfully updated a collector ConfigMap to include this odigosConfigExtension action's processor configuration.
      This is a technical status for config-extension actions only.
      It does not confirm that the collector has reloaded the config, is healthy, or that the action is applied to all sources.
    states:
    - state: "clusterGateway"
      title: "Added to Cluster Gateway Config"
      summary: "This odigosConfigExtension action's configuration is present in the cluster gateway collector ConfigMap."
      message: "Action was added to the cluster gateway collector ConfigMap."
    - state: "nodeCollector"
      title: "Added to Node Collector Config"
      summary: "This odigosConfigExtension action's configuration is present in the node collector ConfigMap."
      message: "Action was added to the node collector ConfigMap."

  - name: "ConfigRemovedDisabled"
    title: "Removed from Collector Config (Disabled)"
    k8sConditionStatus: "False"
    odigosSeverity: "Disabled"
    summary: "This odigosConfigExtension action is disabled, so its configuration was removed from the collector ConfigMap."
    description: |
      The action uses the odigosConfigExtension config mechanism but is disabled.
      Odigos removed its processor configuration from the collector ConfigMap so it is not part of the pipeline.
      Re-enable the action to add it back to the collector config.
    states:
    - state: "clusterGateway"
      title: "Removed from Cluster Gateway Config (Disabled)"
      summary: "This odigosConfigExtension action is disabled, so its configuration was removed from the cluster gateway collector ConfigMap."
      message: "Action is disabled; removed from the cluster gateway collector ConfigMap."
    - state: "nodeCollector"
      title: "Removed from Node Collector Config (Disabled)"
      summary: "This odigosConfigExtension action is disabled, so its configuration was removed from the node collector ConfigMap."
      message: "Action is disabled; removed from the node collector ConfigMap."
