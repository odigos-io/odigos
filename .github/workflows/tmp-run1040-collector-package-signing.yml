# TEMPORARY — RUN-1040 verification only. REMOVE BEFORE MERGE.
#
# The collector package release path has no PR-triggered staging build, so
# this branch-only workflow runs a goreleaser snapshot build with the real
# signing secrets and asserts the produced rpm/deb packages are GPG-signed
# and verify against the exported public key.
name: TEMP RUN-1040 Collector Package Signing Test

on:
  push:
    branches:
      - run-1040-sign-collector-packages

jobs:
  test-package-signing:
    permissions:
      contents: read
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - name: Write package signing key
        env:
          ODIGOS_PKG_SIGNING_KEY: ${{ secrets.ODIGOS_PKG_SIGNING_KEY }}
        run: |
          # Fail closed, same gate as the release workflow.
          if [ -z "$ODIGOS_PKG_SIGNING_KEY" ]; then
            echo "::error::ODIGOS_PKG_SIGNING_KEY secret is empty; refusing to build unsigned packages"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/odigos-pkg-signing-key.asc"
          (umask 077; printf '%s\n' "$ODIGOS_PKG_SIGNING_KEY" > "$KEY_FILE")
          echo "ODIGOS_PKG_SIGNING_KEY_FILE=$KEY_FILE" >> $GITHUB_ENV

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
          workdir: collector
        env:
          # nfpm reads the signing key passphrase from
          # NFPM_<nfpms id>_PASSPHRASE; the nfpms id is "packages".
          NFPM_PACKAGES_PASSPHRASE: ${{ secrets.ODIGOS_PKG_SIGNING_KEY_PASSPHRASE }}

      - name: Verify package signatures
        run: |
          set -euo pipefail

          # Export the public half of the signing key into a throwaway
          # keyring so verification only trusts that one key.
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import "$ODIGOS_PKG_SIGNING_KEY_FILE"
          PUB_KEY="$RUNNER_TEMP/odigos-pkg-signing-pub.asc"
          gpg --batch --armor --export > "$PUB_KEY"

          shopt -s nullglob
          rpms=(collector/dist/*.rpm)
          debs=(collector/dist/*.deb)
          if [ ${#rpms[@]} -eq 0 ] || [ ${#debs[@]} -eq 0 ]; then
            echo "::error::expected rpm and deb packages in collector/dist, found rpms=${#rpms[@]} debs=${#debs[@]}"
            exit 1
          fi

          command -v rpm >/dev/null || sudo apt-get install -y rpm
          sudo rpm --import "$PUB_KEY"
          for f in "${rpms[@]}"; do
            echo "verifying $f"
            rpm -Kv "$f"
            # rpm -K passes for unsigned packages too (digests only), so
            # require an actual OK GPG signature line.
            if ! rpm -Kv "$f" | grep -Eq 'Signature, key ID [0-9a-f]+: OK'; then
              echo "::error::$f has no valid GPG signature"
              exit 1
            fi
          done

          for f in "${debs[@]}"; do
            echo "verifying $f"
            if ! ar t "$f" | grep -qx '_gpgorigin'; then
              echo "::error::$f has no _gpgorigin member (unsigned)"
              exit 1
            fi
            # _gpgorigin is a detached signature over the concatenation of
            # the remaining ar members, in archive order.
            fabs=$(readlink -f "$f")
            extract=$(mktemp -d)
            (cd "$extract" && ar x "$fabs" && cat debian-binary control.tar.* data.tar.* > combined)
            gpg --batch --verify "$extract/_gpgorigin" "$extract/combined"
          done

          echo "all rpm and deb packages are signed and verify against the signing key"

      - name: Remove package signing key
        if: always()
        run: |
          if [ -n "${ODIGOS_PKG_SIGNING_KEY_FILE:-}" ] && [ -f "$ODIGOS_PKG_SIGNING_KEY_FILE" ]; then
            shred -u "$ODIGOS_PKG_SIGNING_KEY_FILE"
          fi
