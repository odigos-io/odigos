name: Trigger Odigos Dependency Sync Workflow

on:
  push:
    branches:
      - 'main'
    paths:
      - 'actions/**'
      - 'api/**'
      - 'collector/**'
      - 'common/**'
      - 'config/**'
      - 'destinations/**'
      - 'deviceplugin/**'
      - 'distros/**'
      - 'frontend/**'
      - 'instrumentation/**'
      - 'instrumentationrules/**'
      - 'instrumentor/**'
      - 'k8sutils/**'
      - 'odiglet/**'
      - 'odigosauth/**'
      - 'opampserver/**'
      - 'procdiscovery/**'
      - 'profiles/**'
      - 'recommendations/**'
      - 'status/**'

permissions:
  id-token: write # for the octo-sts OIDC exchange

jobs:
  trigger-odigos-enterprise:
    runs-on: depot-ubuntu-latest
    steps:
      - name: Get sts token for Odigos OSS
        id: sts-oss
        uses: odigos-io/ci-core/sts@main
        with:
          identity: read-pull-requests
          output-git-config: "false"

      - name: Fetch Associated PR
        id: source-pr
        uses: 8BitJonny/gh-get-current-pr@4.0.0
        with:
          github-token: ${{ steps.sts-oss.outputs.GH_TOKEN }}

      - name: Get sts token for Odigos Enterprise
        id: sts-enterprise
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos-enterprise
          identity: trigger-dependency-sync
          output-git-config: "false"

      - name: Trigger process PR in Odigos Enterprise
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.sts-enterprise.outputs.GH_TOKEN }}
          repository: odigos-io/odigos-enterprise
          event-type: process_update_dependencies_pr
          client-payload: '{"pr_creator": "${{ github.event.pusher.name }}", "source_pr_url": "${{ steps.source-pr.outputs.pr_url }}"}'

      - name: Get sts token for Odigos VM Agent
        id: sts-vm-agent
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/vm-agent
          identity: dep-sync-trigger
          output-git-config: "false"

      - name: Trigger process PR in Odigos VM Agent
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.sts-vm-agent.outputs.GH_TOKEN }}
          repository: odigos-io/vm-agent
          event-type: process_update_dependencies_pr
          client-payload: '{"pr_creator": "${{ github.event.pusher.name }}", "source_pr_url": "${{ steps.source-pr.outputs.pr_url }}"}'
