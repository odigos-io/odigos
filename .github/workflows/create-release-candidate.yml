name: 'Create Release Candidate'

on:
  workflow_dispatch:
    inputs:
      oss_branch:
        description: "OSS branch to cut the pre-release from"
        required: false
        default: "main"
      enterprise_branch:
        description: "Enterprise branch to cut the pre-release from"
        required: false
        default: "main"

permissions: read-all

jobs:
  create-release-candidate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Get sts tokens
        id: sts-create-rc
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos
          identity: create-prerelease
          output-git-config: "true"
      
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.sts-create-rc.outputs.GH_TOKEN }}

      - name: Get latest stable version
        id: get_version
        run: |
          # Get all tags and filter for stable versions (no -rc or other suffixes)
          # Sort them and get the latest one
          LATEST_STABLE=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Latest stable version is: $LATEST_STABLE"
          echo "latest_stable=$LATEST_STABLE" >> $GITHUB_OUTPUT

      - name: Calculate next stable version
        id: next_version
        run: |
          LATEST_STABLE=${{ steps.get_version.outputs.latest_stable }}

          # Extract version components
          IFS='.' read -r major minor patch <<< "${LATEST_STABLE#v}"

          # Increment minor version for new release series
          target_minor=$((minor + 1))
          RELEASE_BASE="v$major.$target_minor.0"

          # Look for tags in the new series, including RCs
          SERIES_TAGS=$(git tag -l "v$major.$target_minor.*" | sort -V)

          if [ -z "$SERIES_TAGS" ]; then
            # No tags yet in this series → first RC will be vX.Y.0-rc0
            NEXT_STABLE="$RELEASE_BASE"
          else
            # Check if there’s already a stable tag in the series
            LATEST_SERIES_STABLE=$(echo "$SERIES_TAGS" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1)

            if [ -z "$LATEST_SERIES_STABLE" ]; then
              # Only RCs exist so far → stick with vX.Y.0
              NEXT_STABLE="$RELEASE_BASE"
            else
              # At least one stable release exists → bump patch
              series_patch=$(echo "$LATEST_SERIES_STABLE" | awk -F. '{print $3}')
              NEXT_STABLE="v$major.$target_minor.$((series_patch + 1))"
            fi
          fi

          echo "Next stable version will be: $NEXT_STABLE"
          echo "release_base=$RELEASE_BASE" >> $GITHUB_OUTPUT
          echo "next_stable=$NEXT_STABLE" >> $GITHUB_OUTPUT


      - name: Calculate release tag
        id: rc_version
        env:
          OSS_BRANCH: ${{ inputs.oss_branch }}
          ENTERPRISE_BRANCH: ${{ inputs.enterprise_branch }}
        run: |
          NEXT_STABLE="${{ steps.next_version.outputs.next_stable }}"

          if [ "$OSS_BRANCH" = "main" ] && [ "$ENTERPRISE_BRANCH" = "main" ]; then
            # Official pre-release: part of the numbered RC sequence, eligible
            # for promotion to stable via promote-rc-to-stable.yml.
            RC_VERSIONS=$(git tag -l "${NEXT_STABLE}-rc*" | sort -V)
            if [ -z "$RC_VERSIONS" ]; then
              RC_VERSION="${NEXT_STABLE}-rc0"
            else
              LATEST_RC=$(echo "$RC_VERSIONS" | tail -n 1)
              RC_NUM=$(echo "$LATEST_RC" | grep -oE 'rc[0-9]+' | grep -oE '[0-9]+')
              RC_VERSION="${NEXT_STABLE}-rc$((RC_NUM + 1))"
            fi
            IS_DEV=false
          else
            # Dev build from a non-main branch: one reusable tag, force-moved
            # on every run rather than numbered. Its format never matches
            # promote-rc-to-stable.yml's rc-tag validation, so it can't be
            # promoted - not just discouraged, structurally rejected.
            RC_VERSION="${NEXT_STABLE}-dev01"
            IS_DEV=true
          fi

          echo "Release tag will be: $RC_VERSION"
          echo "rc_version=$RC_VERSION" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT
          echo "release_branch_name=releases/${{ steps.next_version.outputs.release_base }}" >> $GITHUB_OUTPUT

      - name: Ensure OSS release branch exists
        if: steps.rc_version.outputs.is_dev != 'true'
        env:
          OSS_BRANCH: ${{ inputs.oss_branch }}
          RELEASE_BRANCH: ${{ steps.rc_version.outputs.release_branch_name }}
        run: |
          set -euo pipefail
          # cherry-pick.yml and full-build.yaml's releases/** checks target this
          # branch throughout the RC cycle, not just once it's stable - keep it
          # around from the first RC, same as before.
          git fetch origin "$OSS_BRANCH"
          if git ls-remote --heads origin "$RELEASE_BRANCH" | grep -qE "refs/heads/${RELEASE_BRANCH}$"; then
            echo "Branch '$RELEASE_BRANCH' already exists."
            if ! git merge-base --is-ancestor "origin/${OSS_BRANCH}" "origin/${RELEASE_BRANCH}"; then
              echo "::warning::'$RELEASE_BRANCH' already exists and does not contain the tip of '$OSS_BRANCH' - oss_branch is only applied the first time this branch is created, so it was ignored this run."
            fi
          else
            echo "Creating '$RELEASE_BRANCH' from '$OSS_BRANCH'"
            git branch "$RELEASE_BRANCH" "origin/$OSS_BRANCH"
            git push origin "$RELEASE_BRANCH"
          fi

      - name: Get enterprise Sts Token
        id: sts-enterprise
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos-enterprise
          identity: trigger-ensure-release-branch
          output-git-config: "false"

      - name: Ensure enterprise release branch exists
        if: steps.rc_version.outputs.is_dev != 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.sts-enterprise.outputs.GH_TOKEN }}
          repository: odigos-io/odigos-enterprise
          event-type: ensure-release-branch
          client-payload: '{"branch":"${{ steps.rc_version.outputs.release_branch_name }}","source_branch":"${{ inputs.enterprise_branch }}"}'

      - name: Wait for enterprise release branch to exist
        if: steps.rc_version.outputs.is_dev != 'true'
        env:
          GH_TOKEN: ${{ steps.sts-enterprise.outputs.GH_TOKEN }}
          RELEASE_BRANCH: ${{ steps.rc_version.outputs.release_branch_name }}
        run: |
          set -euo pipefail
          # dispatch above is fire-and-forget; tagging below needs this branch to
          # already exist, so poll rather than race it.
          for i in $(seq 1 30); do
            if gh api "repos/odigos-io/odigos-enterprise/branches/$RELEASE_BRANCH" >/dev/null 2>&1; then
              echo "Enterprise branch '$RELEASE_BRANCH' confirmed."
              exit 0
            fi
            echo "Waiting for enterprise branch '$RELEASE_BRANCH' to be created... ($i/30)"
            sleep 10
          done
          echo "ERROR: enterprise branch '$RELEASE_BRANCH' was not created in time."
          exit 1

      - name: Tag release from oss_branch
        id: tag_rc
        env:
          OSS_BRANCH: ${{ inputs.oss_branch }}
          RC_VERSION: ${{ steps.rc_version.outputs.rc_version }}
          IS_DEV: ${{ steps.rc_version.outputs.is_dev }}
        run: |
          set -euo pipefail
          git fetch origin "$OSS_BRANCH"

          if [ "$IS_DEV" = "true" ] && git rev-parse "$RC_VERSION" >/dev/null 2>&1; then
            echo "Moving existing dev tag $RC_VERSION"
            git push origin ":refs/tags/$RC_VERSION"
            git tag -d "$RC_VERSION"
          fi

          if git rev-parse "$RC_VERSION" >/dev/null 2>&1; then
            echo "Tag $RC_VERSION already exists, skipping."
          else
            echo "Tagging $RC_VERSION from origin/$OSS_BRANCH"
            git tag "$RC_VERSION" "origin/$OSS_BRANCH"
            git push origin "$RC_VERSION"
          fi

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Successfully cut ${{ steps.rc_version.outputs.rc_version }} (oss: ${{ inputs.oss_branch }}, enterprise: ${{ inputs.enterprise_branch }})"
          failure-description: "ERROR: Failed to cut ${{ steps.rc_version.outputs.rc_version }}"
          tag: ${{ steps.rc_version.outputs.rc_version }}
