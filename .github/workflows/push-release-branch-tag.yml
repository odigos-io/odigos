name: 'Push Tag for Release PR Merge'

on:
  push:
    branches:
      - 'releases/**'

permissions: read-all

jobs:
  tag-release-branch-version:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:

      - name: Get sts tokens
        id: sts-this-repo
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos
          identity: push-tags
          output-git-config: "true"

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history required to create tags
          token: ${{ steps.sts-this-repo.outputs.GH_TOKEN }}

      - name: Configure Git for bot commits
        run: |
          git config user.email "bot@odigos.io"
          git config user.name "Odigos Release Bot"

      - name: Extract tag from commit message
        id: extract_tag
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit message: $COMMIT_MSG"

          # Extract the tag version from the message (e.g., v1.1.1, v1.2.3-rc4, v1.2.3-foobar)
          # Handle both "patch release" and "release candidate" formats
          if echo "$COMMIT_MSG" | grep -qE '^This is an automated PR for the (patch release|release candidate)'; then
            # Extract a proper tag at the end: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN
            TAG=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$' || true)
          else
            echo "Commit message does not match expected automated PR formats. Skipping."
            exit 0
          fi

          if [ -z "$TAG" ]; then
            echo "Commit message matched, but no valid tag found at the end. Skipping."
            exit 0
          fi

          REBUILD_VLLM="false"
          if echo "$COMMIT_MSG" | grep -Eqi 'Rebuild vLLM:\s*true'; then
            REBUILD_VLLM="true"
          fi

          echo "Found tag from pull request: $TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "rebuild_vllm=$REBUILD_VLLM" >> "$GITHUB_OUTPUT"

      - name: Push tag to upstream
        if: env.TAG != ''
        env:
          REBUILD_VLLM: ${{ steps.extract_tag.outputs.rebuild_vllm }}
        run: |

          TAG="${{ env.TAG }}"

          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping push."
            exit 0
          fi

          # Annotated so publish-modules can pass rebuild_vllm through to enterprise.
          git tag -a "$TAG" -m "rebuild_vllm=${REBUILD_VLLM}"
          git push origin "$TAG"

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Odigos tagging of release PR pushed successfully with tag ${{ env.TAG }}"
          failure-description: "ERROR: Odigos tagging of release PR failed for tag ${{ env.TAG }}"
          tag: ${{ env.TAG }}
