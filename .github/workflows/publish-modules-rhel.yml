name: Publish Modules for RHEL

# Builds RHEL-certified images by wrapping already-published OSS and enterprise
# component images onto ubi-micro with a shared odigos-licenses image (no recompilation).
# Prerequisite: non-RHEL images for this tag must already be published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'image tag'
        required: true
      source_registry:
        description: 'Registry hosting the already-published non-RHEL component images'
        required: true
        type: choice
        default: us-central1-docker.pkg.dev/odigos-cloud/components
        options:
          - us-central1-docker.pkg.dev/odigos-cloud/components
          - keyval
          - ghcr.io/odigos-io
          - quay.io/odigos

env:
  LICENSES_IMAGE_NAME: odigos-licenses
  AR_REGISTRY: us-central1-docker.pkg.dev/odigos-cloud/components

jobs:
  publish-licenses:
    runs-on: depot-ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout OSS repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - id: gcp-auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 1200s

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push odigos-licenses image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./rhel/Dockerfile.licenses
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            ENTERPRISE_REF=main
          secrets: |
            github_token=${{ secrets.RELEASE_BOT_TOKEN }}
          tags: |
            ${{ env.AR_REGISTRY }}/${{ env.LICENSES_IMAGE_NAME }}:${{ inputs.tag }}
            keyval/${{ env.LICENSES_IMAGE_NAME }}:${{ inputs.tag }}
            ghcr.io/odigos-io/${{ env.LICENSES_IMAGE_NAME }}:${{ inputs.tag }}
            quay.io/odigos/${{ env.LICENSES_IMAGE_NAME }}:${{ inputs.tag }}

  publish-images-rhel:
    needs: publish-licenses
    runs-on: depot-ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # OSS components
          - image: odigos-autoscaler
            wrap_target: wrap-app
            summary: 'Autoscaler for Odigos'
            description: 'Autoscaler manages the installation of Odigos components.'
          - image: odigos-scheduler
            wrap_target: wrap-app
            summary: 'Scheduler for Odigos'
            description: 'Scheduler manages the installation of OpenTelemetry Collectors with Odigos.'
          - image: odigos-instrumentor
            wrap_target: wrap-app
            summary: 'Instrumentor for Odigos'
            description: 'Instrumentor manages auto-instrumentation for workloads with Odigos.'
          - image: odigos-collector
            wrap_target: wrap-collector
            summary: 'Odigos Collector'
            description: 'The Odigos build of the OpenTelemetry Collector.'
          - image: odigos-odiglet
            wrap_target: wrap-odiglet
            summary: 'Odiglet for Odigos'
            description: 'Odiglet is the core component of Odigos managing auto-instrumentation. This image requires a root user to load and manage eBPF programs.'
          - image: odigos-ui
            wrap_target: wrap-ui
            summary: 'UI for Odigos'
            description: 'UI provides the frontend webapp for managing an Odigos installation.'
          - image: odigos-operator
            wrap_target: wrap-operator
            summary: 'Odigos Operator'
            description: 'The Odigos Operator installs and manages Odigos in a cluster'
          - image: odigos-agents
            wrap_target: wrap-agents
            summary: 'Odigos Agents'
            description: 'The Odigos Agents used to copy Odigos agent relevant files into the user workloads.'
          - image: odigos-cli
            wrap_target: wrap-cli
            summary: 'Odigos CLI'
            description: 'Odigos CLI to install and manage Odigos in your Kubernetes cluster.'
          # Enterprise components (same registries / wrap Dockerfile as OSS)
          - image: odigos-enterprise-instrumentor
            wrap_target: wrap-app
            summary: 'Enterprise Instrumentor for Odigos'
            description: 'Enterprise Instrumentor manages auto-instrumentation for workloads with Odigos.'
          - image: odigos-enterprise-collector
            wrap_target: wrap-enterprise-collector
            summary: 'Enterprise Collector for Odigos'
            description: 'Enterprise build of the Odigos OpenTelemetry Collector.'
          - image: odigos-enterprise-odiglet
            wrap_target: wrap-odiglet
            summary: 'Enterprise Odiglet for Odigos'
            description: 'Enterprise Odiglet is the core component of Odigos managing auto-instrumentation. This image requires a root user to load and manage eBPF programs.'
          - image: odigos-enterprise-agents
            wrap_target: wrap-agents
            summary: 'Odigos Enterprise Agents'
            description: 'The Odigos Agents used to copy Odigos agent relevant files into the user workloads.'
          - image: odigos-enterprise-ui
            wrap_target: wrap-app
            summary: 'Enterprise UI for Odigos'
            description: 'Enterprise build of the Odigos web frontend.'
          - image: odigos-enterprise-central-proxy
            wrap_target: wrap-app
            summary: 'Central Proxy for Odigos'
            description: 'Central Proxy connects Odigos in workload clusters to Odigos Central.'
          - image: odigos-enterprise-central-backend
            wrap_target: wrap-app
            summary: 'Central Backend for Odigos'
            description: 'Central Backend provides the API and coordination for Odigos Central multi-cluster management.'
          - image: odigos-enterprise-central-ui
            wrap_target: wrap-central-ui
            summary: 'Central UI for Odigos'
            description: 'Central UI provides the web application for managing Odigos Central.'
          - image: odigos-enterprise-insights
            wrap_target: wrap-app
            summary: 'Insights for Odigos'
            description: 'Insights ingests distributed traces, learns per-entity baselines, and exposes anomaly queries to the UI.'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - id: gcp-auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 1200s

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Wrap and push RHEL image for ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./rhel/Dockerfile.wrap
          target: ${{ matrix.wrap_target }}
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            SOURCE_IMAGE=${{ inputs.source_registry }}/${{ matrix.image }}:${{ inputs.tag }}
            LICENSES_IMAGE=${{ env.AR_REGISTRY }}/${{ env.LICENSES_IMAGE_NAME }}:${{ inputs.tag }}
            NAME=${{ matrix.image }}
            VERSION=${{ inputs.tag }}
            RELEASE=${{ inputs.tag }}
            SUMMARY=${{ matrix.summary }}
            DESCRIPTION=${{ matrix.description }}
          tags: |
            ${{ env.AR_REGISTRY }}/${{ matrix.image }}-rhel-certified:${{ inputs.tag }}
            keyval/${{ matrix.image }}-rhel-certified:${{ inputs.tag }}
            ghcr.io/odigos-io/${{ matrix.image }}-rhel-certified:${{ inputs.tag }}
            quay.io/odigos/${{ matrix.image }}-rhel-certified:${{ inputs.tag }}
