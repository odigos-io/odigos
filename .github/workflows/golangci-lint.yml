name: golangci-lint
on:
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    strategy:
      matrix:
        modules: [common, k8sutils, profiles, destinations, procdiscovery]
    name: lint
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache-dependency-path: ${{ matrix.modules }}/go.sum
      - run: make lint MODULE=${{ matrix.modules }}
