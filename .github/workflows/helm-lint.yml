name: Lint Charts

on:
  pull_request:
    paths:
      - helm/**
      - tests/e2e/helm-chart/check-marketplace.py
      - scripts/check-eks-addon-readiness.py
      - scripts/test-eks-addon-readiness.py
      - scheduler/clusterinfo/**

jobs:
  lint-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint Charts
        run: helm lint helm/odigos helm/odigos-central
      - name: Install rendering test dependencies
        run: python3 -m pip install PyYAML==6.0.3 jsonschema==4.25.1
      - name: Verify Marketplace and existing activation modes
        run: python3 tests/e2e/helm-chart/check-marketplace.py
      - name: Verify EKS candidate packaging
        run: |
          python3 scripts/test-eks-addon-readiness.py
          python3 helm/eks-addon/test_build.py

  addon-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: scheduler/go.mod
          cache-dependency-path: scheduler/go.sum
      - name: Verify runtime state initialization
        working-directory: scheduler
        run: go test -race ./clusterinfo ./controllers/odigospro

  generate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      - name: Generate Helm Schema
        run: make helm-schema
      - name: Check for schema changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git diff
            echo "Helm values.schema.json is out of date. Please run 'make helm-schema' and commit the changes."
            exit 1
          fi
