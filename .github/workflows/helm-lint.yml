name: Lint Charts

on:
  pull_request:
    paths:
      - helm/**
      - tests/e2e/helm-chart/**

jobs:
  lint-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint Charts
        run: helm lint helm/odigos helm/odigos-central
      - name: Check odiglet privileged mount propagation
        working-directory: tests/e2e/helm-chart
        run: ./check-odiglet-privileged-mounts.sh "../../.."

  generate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      - name: Generate Helm Schema
        run: make helm-schema
      - name: Check for schema changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git diff
            echo "Helm values.schema.json is out of date. Please run 'make helm-schema' and commit the changes."
            exit 1
          fi
