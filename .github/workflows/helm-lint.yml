name: Lint Charts

on:
  pull_request:
    paths:
      - helm/**
      - scripts/helm-odiglet-security-test.py
      - .github/workflows/helm-lint.yml

jobs:
  lint-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint Charts
        run: helm lint helm/odigos helm/odigos-central

  generate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
      - name: Generate Helm Schema
        run: make helm-schema
      - name: Check for schema changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git diff
            echo "Helm values.schema.json is out of date. Please run 'make helm-schema' and commit the changes."
            exit 1
          fi

  odiglet-security-profiles:
    # Pins the odiglet securityContext across every permutation of
    # odiglet.securityProfile and the individual switches, and diffs the
    # rendered daemonset against the commit before security profiles existed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # full history: the test renders the chart from a git worktree of the
          # pre-change commit and diffs the two renders.
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Odiglet security profile tests
        run: make helm-test
