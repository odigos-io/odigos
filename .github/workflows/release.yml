name: Release Odigos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true

  repository_dispatch:
    types: [release_cli]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  DOCKERHUB_ORG: "keyval"
  VICTORIA_METRICS_VERSION: "v1.144.0"

jobs:
  package-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Tag Value
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TAG=${{ github.event.client_payload.tag }}" >> $GITHUB_ENV
          else
            echo "Unknown event type"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }} # checkout the tag we are releasing (main might have been updated since the tag was created)

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.15.2

      - name: Package Helm charts
        run: bash ./scripts/package-charts.sh

      - name: Upload packaged chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: odigos-chart
          path: helm/odigos-*.tgz

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Helm charts packaged successfully"
          failure-description: "ERROR: Failed to package Helm charts"
          tag: ${{ env.TAG }}

  build-cli:
    needs: [package-helm]
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Determine Tag Value
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TAG=${{ github.event.client_payload.tag }}" >> $GITHUB_ENV
          else
            echo "Unknown event type"
            exit 1
          fi

      - name: Check Release Type
        run: |
          TAG="${{ env.TAG }}"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-feat\. ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "IS_FEATURE_RELEASE=true" >> $GITHUB_ENV
            echo "This is a feature release: $TAG"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "IS_FEATURE_RELEASE=false" >> $GITHUB_ENV
            echo "This is a pre-release: $TAG"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "IS_FEATURE_RELEASE=false" >> $GITHUB_ENV
            echo "This is a stable release: $TAG"
          fi

          # Release branch for tag: v1.17.6 -> releases/v1.17.0
          VERSION="${TAG#v}"
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          echo "RELEASE_BRANCH=releases/v${MAJOR_MINOR}.0" >> $GITHUB_ENV

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }} # checkout the tag we are releasing (main might have been updated since the tag was created)

      # Ensure the chart is here to be embedded in the CLI
      - name: Download packaged chart artifact
        uses: actions/download-artifact@v4
        with:
          name: odigos-chart
          path: cli/pkg/helm/embedded

      - name: Set env
        id: vars
        run: |
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          echo "short_commit=${SHORT_COMMIT}" >> $GITHUB_ENV
          echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Notify Slack Start
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Starting Odigos CLI release for tag ${{ env.TAG }}"
          failure-description: "ERROR: Failed to start Odigos CLI release"
          tag: ${{ env.TAG }}

      - name: Verify Components Image Ready
        run: |
          declare -a REPOS=("odigos-autoscaler" "odigos-scheduler" "odigos-instrumentor" "odigos-odiglet" "odigos-collector" "odigos-enterprise-collector" "odigos-enterprise-odiglet" "odigos-ui" "odigos-enterprise-instrumentor" "odigos-operator" "odigos-enterprise-agents" "odigos-enterprise-insights" "odigos-enterprise-central-backend" "odigos-enterprise-central-proxy" "odigos-enterprise-central-ui" "odigos-enterprise-connector-runtime" "odigos-enterprise-connector-aws" "odigos-enterprise-connector-azure" "odigos-enterprise-connector-gcp" "odigos-enterprise-connector-postgres")

          TAG_TO_CHECK=${{ env.TAG }}

          for REPO in "${REPOS[@]}"; do
            echo "Checking tag $TAG_TO_CHECK in $REPO..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://artifactregistry.us-central1.rep.googleapis.com/v1/projects/odigos-cloud/locations/us-central1/repositories/components/packages/$REPO/tags/$TAG_TO_CHECK")

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Tag $TAG_TO_CHECK exists in $REPO."
            else
              echo "Tag $TAG_TO_CHECK does NOT exist in $REPO. HTTP status: $HTTP_STATUS"
              exit 1
            fi
          done

      - id: gcp-auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 1200s

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Check if Homebrew tap should be updated
        run: |
          # Feature drops are not an official channel; do not move the RC tap.
          if [ "${{ env.IS_FEATURE_RELEASE }}" = "true" ]; then
            echo "Feature release $TAG — skipping Homebrew tap update"
            echo "SKIP_HOMEBREW_UPDATE=true" >> $GITHUB_ENV
            exit 0
          fi

          # Pre-releases always update their respective tap (homebrew-odigos-cli-rc)
          if [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
            echo "Pre-release detected, will update Homebrew RC tap"
            echo "SKIP_HOMEBREW_UPDATE=false" >> $GITHUB_ENV
            exit 0
          fi

          # For stable releases, check if this version is newer than what's currently in the tap.
          # This prevents older patch releases (e.g. v1.16.9) from overwriting a newer version (e.g. v1.17.0).
          CURRENT_TAP_VERSION=$(curl -sf https://raw.githubusercontent.com/odigos-io/homebrew-odigos-cli/main/odigos.rb \
            | grep 'version "' | head -1 | sed 's/.*version "\(.*\)"/\1/')

          if [ -z "$CURRENT_TAP_VERSION" ]; then
            echo "Could not fetch current tap version, will update Homebrew tap"
            echo "SKIP_HOMEBREW_UPDATE=false" >> $GITHUB_ENV
            exit 0
          fi

          # Strip 'v' prefix from release tag for comparison
          RELEASE_VERSION="${TAG#v}"

          echo "Current Homebrew tap version: $CURRENT_TAP_VERSION"
          echo "New release version: $RELEASE_VERSION"

          # Use sort -V (version sort) to determine which version is greater
          HIGHEST=$(printf '%s\n%s' "$CURRENT_TAP_VERSION" "$RELEASE_VERSION" | sort -V | tail -1)

          if [ "$HIGHEST" = "$RELEASE_VERSION" ] && [ "$CURRENT_TAP_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Release version $RELEASE_VERSION is newer than tap version $CURRENT_TAP_VERSION — will update Homebrew tap"
            echo "SKIP_HOMEBREW_UPDATE=false" >> $GITHUB_ENV
          else
            echo "Release version $RELEASE_VERSION is NOT newer than tap version $CURRENT_TAP_VERSION — skipping Homebrew tap update"
            echo "SKIP_HOMEBREW_UPDATE=true" >> $GITHUB_ENV
          fi
      - name: Check if the :latest image tag should move
        run: |
          # Decide whether this release owns :latest, i.e. whether the tag
          # being released is the newest version we have. Only then may the
          # image tag move; every other release still publishes under its own
          # version tag.

          # A pre-release is never the newest shipped version.
          if [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
            echo "Pre-release $TAG — leaving :latest where it is"
            echo "PUSH_LATEST=false" >> $GITHUB_ENV
            exit 0
          fi

          # Highest stable vX.Y.Z tag in the repo. The tag being released is
          # already among them, so it comes out on top when it really is the
          # newest — and loses to a higher one when this is a patch cut from an
          # older release branch.
          HIGHEST_STABLE=$(git tag -l 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)

          if [ -z "$HIGHEST_STABLE" ]; then
            echo "No stable tags found — moving :latest"
            echo "PUSH_LATEST=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "Releasing: $TAG   highest stable tag: $HIGHEST_STABLE"
          if [ "$TAG" = "$HIGHEST_STABLE" ]; then
            echo "$TAG is the newest stable release — moving :latest"
            echo "PUSH_LATEST=true" >> $GITHUB_ENV
          else
            echo "$TAG is older than $HIGHEST_STABLE — leaving :latest where it is"
            echo "PUSH_LATEST=false" >> $GITHUB_ENV
          fi

      - name: Decide which homebrew repository to authenticate against
        run: |
          HOMEBREW_REPO="homebrew-odigos-cli-rc"
          if [ "${{ env.IS_PRERELEASE }}" != "true" ]; then
            HOMEBREW_REPO="homebrew-odigos-cli"
          fi
          echo "Using Homebrew repository: $HOMEBREW_REPO"
          echo "HOMEBREW_REPO=$HOMEBREW_REPO" >> $GITHUB_ENV
          
      - uses: odigos-io/ci-core/sts@main
        id: sts-goreleaser
        with:
          scope: odigos-io/${{ env.HOMEBREW_REPO }}
          identity: releaser
          output-git-config: "false"

      - uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 #v7.0.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.sts-goreleaser.outputs.GH_TOKEN }}
          IS_PRERELEASE: ${{ env.IS_PRERELEASE }}
          SKIP_HOMEBREW_UPDATE: ${{ env.SKIP_HOMEBREW_UPDATE }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

      - name: Generate and update release notes
        if: env.IS_FEATURE_RELEASE != 'true'
        uses: odigos-io/ci-core/generate-release-notes@main
        continue-on-error: true
        with:
          tag: ${{ env.TAG }}
          release-branch: ${{ env.RELEASE_BRANCH }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack (release notes)
        if: always() && env.IS_FEATURE_RELEASE != 'true'
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Release notes updated successfully"
          failure-description: "ERROR: Failed to update release notes"
          tag: ${{ env.TAG }}

      - uses: ko-build/setup-ko@v0.9

      - name: publish cli image to docker registries
        id: ko-cli
        working-directory: ./cli
        env:
          KO_DOCKER_REPO: us-central1-docker.pkg.dev/odigos-cloud/components/odigos-cli
          KO_CONFIG_PATH: ./.ko.yaml
          VERSION: ${{ env.TAG }}
          SHORT_COMMIT: ${{ steps.vars.outputs.short_commit }}
          DATE: ${{ steps.vars.outputs.date }}
        run: |
          KO_TAGS="--tags ${{ env.TAG }}"
          if [ "${{ env.PUSH_LATEST }}" = "true" ]; then
            KO_TAGS="$KO_TAGS --tags latest"
          fi
          echo "ko tags: $KO_TAGS"
          # ko prints the pushed ref with its digest; capture it so the image
          # can be signed by digest rather than by mutable tag.
          IMAGE_REF=$(ko build --bare $KO_TAGS --platform=linux/amd64,linux/arm64)
          echo "built: ${IMAGE_REF}"
          case "$IMAGE_REF" in
            *@sha256:*) echo "digest=${IMAGE_REF##*@}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::ko did not return a digest ref: ${IMAGE_REF}"; exit 1 ;;
          esac

      # Sign at the source registry before mirroring, so the mirrors can carry
      # the signature and SBOM along as OCI referrers. Fail-closed.
      - name: Sign CLI image and attach SBOM
        uses: odigos-io/ci-core/sign-oci@main
        with:
          refs: us-central1-docker.pkg.dev/odigos-cloud/components/odigos-cli
          digest: ${{ steps.ko-cli.outputs.digest }}

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Copy CLI image to Docker Hub and private GCR
        env:
          SOURCE_IMAGE: us-central1-docker.pkg.dev/odigos-cloud/components/odigos-cli
          DEST_IMAGE: docker.io/${{ env.DOCKERHUB_ORG }}/odigos-cli
          GCR_PRIVATE_DEST_IMAGE: us-central1-docker.pkg.dev/odigos-cloud/components-private/odigos-cli
        run: |
          # oras copy -r rather than crane copy: -r copies the referrers graph
          # (cosign signature and SBOM attestation) along with the image, so
          # the mirrors stay verifiable. crane copy moves only the manifest.
          oras copy -r ${SOURCE_IMAGE}:${{ env.TAG }} ${DEST_IMAGE}:${{ env.TAG }}
          oras copy -r ${SOURCE_IMAGE}:${{ env.TAG }} ${GCR_PRIVATE_DEST_IMAGE}:${{ env.TAG }}

          # Mirror :latest only when this release owns it, so the mirrors stay
          # in step with the source registry.
          if [ "${{ env.PUSH_LATEST }}" = "true" ]; then
            oras copy -r ${SOURCE_IMAGE}:latest ${DEST_IMAGE}:latest
            oras copy -r ${SOURCE_IMAGE}:latest ${GCR_PRIVATE_DEST_IMAGE}:latest
          else
            echo "Skipping :latest mirror for ${{ env.TAG }}"
          fi

      - name: Copy VictoriaMetrics image to Docker Hub and GCR
        id: vm-copy
        env:
          SOURCE_IMAGE: docker.io/victoriametrics/victoria-metrics:${{ env.VICTORIA_METRICS_VERSION }}
          DEST_IMAGE: docker.io/${{ env.DOCKERHUB_ORG }}/odigos-victoria-metrics
          GCR_DEST_IMAGE: us-central1-docker.pkg.dev/odigos-cloud/components/odigos-victoria-metrics
          GCR_PRIVATE_DEST_IMAGE: us-central1-docker.pkg.dev/odigos-cloud/components-private/odigos-victoria-metrics
        run: |
          oras copy -r ${SOURCE_IMAGE} ${DEST_IMAGE}:${{ env.TAG }}
          oras copy -r ${SOURCE_IMAGE} ${GCR_DEST_IMAGE}:${{ env.TAG }}
          oras copy -r ${SOURCE_IMAGE} ${GCR_PRIVATE_DEST_IMAGE}:${{ env.TAG }}

          # VICTORIA_METRICS_VERSION is pinned per branch, so :latest here
          # tracks whichever release owns it rather than the last one to run.
          if [ "${{ env.PUSH_LATEST }}" = "true" ]; then
            oras copy -r ${SOURCE_IMAGE} ${DEST_IMAGE}:latest
            oras copy -r ${SOURCE_IMAGE} ${GCR_DEST_IMAGE}:latest
            oras copy -r ${SOURCE_IMAGE} ${GCR_PRIVATE_DEST_IMAGE}:latest
          else
            echo "Skipping :latest mirror for ${{ env.TAG }}"
          fi

          # The copy preserves the upstream digest; capture it so our copies
          # can be signed by digest.
          echo "digest=$(oras resolve ${SOURCE_IMAGE})" >> "$GITHUB_OUTPUT"

      # VictoriaMetrics is a re-host of an upstream image under our name. The
      # signature attests that WE published this exact digest in our
      # registries — not that we built it. Signed at the destinations because
      # there is no upstream cosign signature to carry over.
      - name: Sign re-hosted VictoriaMetrics image
        uses: odigos-io/ci-core/sign-oci@main
        with:
          refs: |
            docker.io/${{ env.DOCKERHUB_ORG }}/odigos-victoria-metrics
            us-central1-docker.pkg.dev/odigos-cloud/components/odigos-victoria-metrics
            us-central1-docker.pkg.dev/odigos-cloud/components-private/odigos-victoria-metrics
          digest: ${{ steps.vm-copy.outputs.digest }}

      - name: Set notification messages
        run: |
          if [ "${{ env.IS_FEATURE_RELEASE }}" = "true" ]; then
            echo "SUCCESS_MSG=Odigos CLI feature release completed successfully" >> $GITHUB_ENV
            echo "FAILURE_MSG=ERROR: Failed to publish Odigos CLI image to registries" >> $GITHUB_ENV
          elif [ "${{ env.IS_PRERELEASE }}" = "false" ]; then
            echo "SUCCESS_MSG=Odigos CLI stable release completed successfully" >> $GITHUB_ENV
            echo "FAILURE_MSG=ERROR: Failed to publish Odigos CLI image to registries" >> $GITHUB_ENV
          else
            echo "SUCCESS_MSG=Odigos CLI pre-release completed successfully" >> $GITHUB_ENV
            echo "FAILURE_MSG=ERROR: Failed to publish Odigos CLI image to registries" >> $GITHUB_ENV
          fi

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: ${{ env.SUCCESS_MSG }}
          failure-description: ${{ env.FAILURE_MSG }}
          tag: ${{ env.TAG }}

  publish-helm:
    needs: [build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Determine Tag Value
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TAG=${{ github.event.client_payload.tag }}" >> $GITHUB_ENV
          else
            echo "Unknown event type"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }} # checkout the tag we are releasing (main might have been updated since the tag was created)

      - name: Configure Git
        run: |
          git config --global user.email "bot@odigos.io"
          git config --global user.name "Odigos Release Bot"

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.15.2

      - name: Download packaged chart artifact
        uses: actions/download-artifact@v4
        with:
          name: odigos-chart
          path: helm/

      - name: Publish Helm charts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: bash ./scripts/publish-charts.sh

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Helm charts published successfully. new version is ready"
          failure-description: "ERROR: Failed to publish Helm charts"
          tag: ${{ env.TAG }}
