name: "Tag Odigos Modules"
description: "It is needed so they can be consumed as libraries in other projects in the go.mod"

inputs:
  tag:
    description: "The tag to use for all modules"
    required: true

runs:
  using: "composite"
  steps:
    - name: Tag Modules
      shell: bash
      run: |
        git tag actions/${{ inputs.tag }}
        git tag api/${{ inputs.tag }}
        # the collector components, pinned by the enterprise distribution's builder-config.yaml
        git tag collector/config/configgrpc/${{ inputs.tag }}
        git tag collector/connector/odigosrouterconnector/${{ inputs.tag }}
        git tag collector/connector/servicegraphconnector/${{ inputs.tag }}
        git tag collector/connector/serviceioconnector/${{ inputs.tag }}
        git tag collector/exporter/azureblobstorageexporter/${{ inputs.tag }}
        git tag collector/exporter/googlecloudstorageexporter/${{ inputs.tag }}
        git tag collector/exporter/mockdestinationexporter/${{ inputs.tag }}
        git tag collector/extension/odigosconfigk8sextension/${{ inputs.tag }}
        git tag collector/processor/odigosconditionalattributes/${{ inputs.tag }}
        git tag collector/processor/odigosextractattributeprocessor/${{ inputs.tag }}
        git tag collector/processor/odigoslogsresourceattrsprocessor/${{ inputs.tag }}
        git tag collector/processor/odigospiimaskingprocessor/${{ inputs.tag }}
        git tag collector/processor/odigosprofilesprocessor/${{ inputs.tag }}
        git tag collector/processor/odigossqldboperationprocessor/${{ inputs.tag }}
        git tag collector/processor/odigossqlqueryprocessor/${{ inputs.tag }}
        git tag collector/processor/odigossymbolizeprocessor/${{ inputs.tag }}
        git tag collector/processor/odigostailsamplingprocessor/${{ inputs.tag }}
        git tag collector/processor/odigostracefilterprocessor/${{ inputs.tag }}
        git tag collector/processor/odigostracestateprocessor/${{ inputs.tag }}
        git tag collector/processor/odigostrafficmetrics/${{ inputs.tag }}
        git tag collector/processor/odigosurltemplateprocessor/${{ inputs.tag }}
        git tag collector/processor/odigosvmprofileattrsprocessor/${{ inputs.tag }}
        git tag collector/providers/odigosk8scmprovider/${{ inputs.tag }}
        git tag collector/receiver/odigosebpfreceiver/${{ inputs.tag }}
        git tag common/${{ inputs.tag }}
        git tag config/${{ inputs.tag }}
        git tag destinations/${{ inputs.tag }}
        git tag deviceplugin/${{ inputs.tag }}
        git tag distros/${{ inputs.tag }}
        git tag frontend/${{ inputs.tag }}
        git tag instrumentation/${{ inputs.tag }}
        git tag instrumentationrules/${{ inputs.tag }}
        git tag instrumentor/${{ inputs.tag }}
        git tag k8sutils/${{ inputs.tag }}
        git tag odiglet/${{ inputs.tag }}
        git tag odigosauth/${{ inputs.tag }}
        git tag opampserver/${{ inputs.tag }}
        git tag procdiscovery/${{ inputs.tag }}
        git tag profiles/${{ inputs.tag }}
        git tag status/${{ inputs.tag }}
        git push origin --tags
