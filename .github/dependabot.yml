version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: /
    schedule:
      day: sunday
      interval: weekly

  - package-ecosystem: gomod
    directories:
      - /api
      - /autoscaler
      - /cli
      - /common
      - /config
      - /destinations
      - /deviceplugin
      - /distros
      - /frontend
      - /instrumentation
      - /instrumentationrules
      - /instrumentor
      - /k8sutils
      - /odiglet
      - /odigosauth
      - /opampserver
      - /operator
      - /procdiscovery
      - /profiles
      - /scheduler
      - /status
    schedule:
      day: sunday
      interval: weekly
    groups:
      otel-dependencies:
        patterns:
          - 'go.opentelemetry.io*'
        exclude-patterns:
          - 'go.opentelemetry.io/auto'
      go-auto-instrumentations:
        patterns:
          - 'go.opentelemetry.io/auto'
      k8s-dependencies:
        patterns:
          - 'k8s.io*'
          - 'sigs.k8s.io*'

  - package-ecosystem: pip
    directories:
      - /docs
      - /agents/python
    schedule:
      day: sunday
      interval: weekly

  - package-ecosystem: npm
    directories:
      - /frontend/webapp
      - /docs
      - /agents/nodejs-native-community
    schedule:
      day: sunday
      interval: weekly
    groups:
      react-dependencies:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: docker
    directories:
      - /
      - /collector
      - /frontend
      - /odiglet
      - /operator
    schedule:
      day: sunday
      interval: weekly
    allow:
      - dependency-name: 'registry.access.redhat.com/ubi9*'
      - dependency-name: 'golang'
      - dependency-name: 'gcr.io/distroless/*'
