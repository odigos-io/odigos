apiVersion: internal.odigos.io/v1beta1
kind: Recommendation
metadata:
  name: auto-go-offset-updater
spec:
  type: 'AutoGoOffsetUpdater'
  k8sObjectName: 'go-offset-updater'
  oss: false
  categories:
    - Maintenance
    - Reliability

  conditions:
    - type: 'GoEnterpriseSources'

  title: 'Enable go-enterprise automatic offsets updater'
  summary: 'Automatically keeps Go eBPF offsets up to date so applications remain instrumentable when they adopt newly released library versions.'
  description: |
    Every Odigos upgrade already includes up-to-date Go library support. Enable
    this recommendation if your applications often adopt new Go library versions
    before the next Odigos release, or if Odigos is not upgraded frequently, so
    instrumentation keeps working without needing an upgrade.

  docs: "https://docs.odigos.io/enterprise/instrumentations/golang/ebpf#about-go-offsets"

  pros:
    - Keeps Go applications instrumentable when they adopt newer library versions
    - Avoids waiting for an Odigos upgrade or manually handling offsets on an ongoing basis

  cons:
    - Clusters without internet access cannot reach the Odigos offsets endpoint and require a custom workflow to push the updater image to an internal registry

  appliedWhen:
    - type: EffectiveConfig
      expression: "goAutoOffsetsMode != 'off'"

  remediations:
    - type: DirectAutoOffsets
      buttonText: 'Direct — requires internet'
      tooltip: 'Nightly offsets pull from Odigos cloud. Needs internet.'
      steps:
        - type: EditConfig
          path: goAutoOffsetsMode
          value: direct
        - type: EditConfig
          path: goAutoOffsetsCron
          value: '0 0 * * *'
      applyExamples:
        - type: HelmValues
          content: |
            goAutoOffsetsMode: 'direct'
            goAutoOffsetsCron: '0 0 * * *'
    - type: ImageAutoOffsets
      buttonText: 'Mirrored image — needs local registry'
      tooltip: 'Update Go library offsets from a mirrored offsets image on a nightly schedule. For clusters without direct internet access to Odigos cloud.'
      steps:
        - type: EditConfig
          path: goAutoOffsetsMode
          value: image
        - type: EditConfig
          path: goAutoOffsetsCron
          value: '0 0 * * *'
      applyExamples:
        - type: HelmValues
          content: |
            goAutoOffsetsMode: 'image'
            goAutoOffsetsCron: '0 0 * * *'
