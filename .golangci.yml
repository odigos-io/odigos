version: "2"

run:
  timeout: 10m

# Only linters that find bugs. Style, naming, formatting and idiom rewrites are intentionally left out.
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - unparam
    - wastedassign

    # nil and error handling
    - nilerr
    - nilnesserr
    - errorlint
    - errchkjson

    # resources, contexts and concurrency
    - bodyclose
    - noctx
    - contextcheck
    - fatcontext
    - spancheck

    # subtle misuse
    - asasalint
    - bidichk
    - durationcheck
    - exhaustive
    - gocheckcompilerdirectives
    - loggercheck
    - makezero
    - nosprintfhostport
    - predeclared
    - reassign
    - gocritic
    - revive
    - gosec

    - nolintlint

    # tests
    - testifylint
    - usetesting

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    staticcheck:
      # SA is the correctness suite; S, ST and QF are simplifications, style and quick fixes.
      checks:
        - SA*

    errcheck:
      check-type-assertions: true

    gocritic:
      enabled-tags:
        - diagnostic
      disabled-tags:
        - style
        - performance
        - opinionated
      disabled-checks:
        - filepathJoin

    revive:
      rules:
        - name: atomic
        - name: constant-logical-expr
        - name: context-keys-type
        - name: datarace
        - name: defer
        - name: identical-branches
        - name: modifies-value-receiver
        - name: struct-tag
          arguments:
            - json,inline
        - name: unconditional-recursion
        - name: unreachable-code
        - name: waitgroup-by-value

    exhaustive:
      default-signifies-exhaustive: true

    nolintlint:
      allow-unused: true
      require-specific: true

    gosec:
      includes:
        - G110 # decompression bomb
        - G111 # http.Dir directory traversal
        - G112 # slowloris: http.Server without ReadHeaderTimeout
        - G114 # http.ListenAndServe without timeouts
        - G306 # WriteFile permissions
        - G401 # weak crypto

    testifylint:
      disable-all: true
      enable:
        - error-is-as
        - float-compare
        - formatter
        - go-require
        - suite-broken-parallel
        - suite-subtest-run
        - useless-assert

    usetesting:
      context-background: false
      context-todo: false

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
    rules:
      # Allow returning an error that is currently always nil, as preparation for future error paths.
      - linters:
          - unparam
        text: 'result \d+ \(error\) is always nil'

      # Errors from cleanup methods have no meaningful recovery.
      - linters:
          - errcheck
        source: '\.(Close|Shutdown|Discard)\('

      - path: _test\.go$
        linters:
          - errcheck
          - errchkjson
          - unparam
          - bodyclose
          - noctx
          - contextcheck
          - exhaustive
          - gosec

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
