version: 2
project_name: odigos-otelcol

before:
  hooks:
    - go mod tidy -C odigosotelcol
    # Write the release tag to a VERSION file shipped inside the package so
    # downstream tools (e.g. odictl) can read the installed collector version
    - sh -c 'printf "%s\n" "{{ .Tag }}" > distribution/odigos-otelcol/VERSION'

builds:
  - id: odigos-otelcol-linux
    env: [CGO_ENABLED=0]
    dir: odigosotelcol
    main: .
    binary: odigos-otelcol
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -checklinkname=0

nfpms:
  - id: packages
    package_name: odigos-otelcol
    vendor: Odigos Inc.
    maintainer: Odigos Inc.
    homepage: https://odigos.io
    description: Instant distributed tracing without code changes using eBPF
    formats:
      - deb
      - rpm
    file_name_template: "{{ .ConventionalFileName }}"
    contents:
      - src: distribution/odigos-otelcol/odigos-otelcol.service
        dst: /usr/lib/systemd/system/odigos-otelcol.service

      - src: distribution/odigos-otelcol/odigos-otelcol-config.service
        dst: /usr/lib/systemd/system/odigos-otelcol-config.service

      - src: distribution/odigos-otelcol/odigos-otelcol-config.path
        dst: /usr/lib/systemd/system/odigos-otelcol-config.path

      - src: distribution/odigos-otelcol/odigos-otelcol.conf
        dst: /etc/odigos-otelcol/odigos-otelcol.conf
        type: config|noreplace

      - src: distribution/odigos-otelcol/config.yaml
        dst: /etc/odigos-otelcol/config.yaml
        type: config|noreplace

      # Generated by the `before` hook above; intentionally not a config file so
      # it is overwritten on every upgrade and removed on uninstall.
      - src: distribution/odigos-otelcol/VERSION
        dst: /etc/odigos-otelcol/VERSION

    scripts:
      preinstall: distribution/odigos-otelcol/preinstall.sh
      postinstall: distribution/odigos-otelcol/postinstall.sh
      preremove: distribution/odigos-otelcol/preremove.sh

    # GPG-sign both package formats. The key file path comes from the
    # environment so this config stays key-agnostic; goreleaser fails the
    # build if ODIGOS_PKG_SIGNING_KEY_FILE is unset, so packages can never be
    # produced unsigned by accident. nfpm takes the key passphrase from
    # $NFPM_PACKAGES_PASSPHRASE (NFPM_<nfpms id>_PASSPHRASE).
    rpm:
      signature:
        key_file: "{{ .Env.ODIGOS_PKG_SIGNING_KEY_FILE }}"
    deb:
      signature:
        # Default method (debsign) embeds an armored detached signature over
        # debian-binary + control.tar.gz + data.tar.* as the _gpgorigin
        # ar member.
        key_file: "{{ .Env.ODIGOS_PKG_SIGNING_KEY_FILE }}"

release:
  disable: true
