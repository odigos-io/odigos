apiVersion: internal.odigos.io/v1beta1
kind: Destination
metadata:
  type: victorialogs
  displayName: VictoriaLogs
  category: self hosted
spec:
  testConnectionSupported: true
  image: victoriametrics.svg
  signals:
    traces:
      supported: false
    metrics:
      supported: false
    logs:
      supported: true
    profiles:
      supported: false
  fields:
  - name: VICTORIA_LOGS_ENDPOINT
    displayName: Logs Endpoint
    componentType: input
    componentProps:
      required: true
      type: text
      placeholder: http://victorialogs:9428
      tooltip: Base URL or complete /insert/opentelemetry/v1/logs URL. For a reverse
        proxy or cloud deployment, use the full ingestion URL.
  - name: VICTORIA_LOGS_AUTH
    displayName: Authentication
    componentType: dropdown
    componentProps:
      required: false
      values:
      - none
      - basic
      - bearer
    initialValue: none
  - name: VICTORIA_LOGS_USERNAME
    displayName: Basic Auth Username
    componentType: input
    componentProps:
      required: true
      type: text
    renderCondition:
    - VICTORIA_LOGS_AUTH
    - ==
    - basic
  - name: VICTORIA_LOGS_PASSWORD
    displayName: Basic Auth Password
    componentType: input
    componentProps:
      required: true
      type: password
    secret: true
    renderCondition:
    - VICTORIA_LOGS_AUTH
    - ==
    - basic
  - name: VICTORIA_LOGS_TOKEN
    displayName: Bearer Token
    componentType: input
    componentProps:
      required: true
      type: password
    secret: true
    renderCondition:
    - VICTORIA_LOGS_AUTH
    - ==
    - bearer
  - name: VICTORIA_LOGS_COMPRESSION
    displayName: Compression
    componentType: dropdown
    componentProps:
      required: false
      values:
      - gzip
      - none
    initialValue: gzip
  - name: VICTORIA_LOGS_CA_PEM
    displayName: Certificate Authority
    componentType: textarea
    componentProps:
      required: false
      tooltip: PEM CA certificate for HTTPS. HTTPS uses system roots when this is
        empty.
  - name: VICTORIA_LOGS_INSECURE_SKIP_VERIFY
    displayName: Skip TLS Certificate Verification
    componentType: checkbox
    componentProps:
      required: false
      tooltip: For testing only. HTTPS enables TLS automatically; leave verification
        enabled in production.
    initialValue: false
  - name: VICTORIA_LOGS_ACCOUNT_ID
    displayName: Account ID
    componentType: input
    componentProps:
      required: false
      type: text
      tooltip: Optional VictoriaLogs tenant account ID; defaults to 0.
  - name: VICTORIA_LOGS_PROJECT_ID
    displayName: Project ID
    componentType: input
    componentProps:
      required: false
      type: text
      tooltip: Optional VictoriaLogs tenant project ID; defaults to 0.
  - name: VICTORIA_LOGS_MSG_FIELD
    displayName: Message Fields
    componentType: input
    componentProps:
      required: false
      type: text
      tooltip: Comma-separated message fields. OTLP log bodies are mapped automatically;
        normally leave empty.
  - name: VICTORIA_LOGS_TIME_FIELD
    displayName: Time Fields
    componentType: input
    componentProps:
      required: false
      type: text
      tooltip: Comma-separated timestamp fields. OTLP timestamps are mapped automatically;
        normally leave empty.
  - name: VICTORIA_LOGS_STREAM_FIELDS
    displayName: Stream Fields
    componentType: input
    componentProps:
      required: false
      type: text
      tooltip: Comma-separated stream fields. Empty uses all OTLP resource attributes.
  - name: VICTORIA_LOGS_IGNORE_FIELDS
    displayName: Ignore Fields
    componentType: input
    componentProps:
      required: false
      type: text
      tooltip: Comma-separated fields to omit. Field prefixes ending in * are supported.
  - name: VICTORIA_LOGS_EXTRA_FIELDS
    displayName: Extra Fields
    componentType: input
    componentProps:
      required: false
      type: text
      tooltip: Comma-separated field=value pairs to add or overwrite.
  - name: VICTORIA_LOGS_DECOLORIZE_FIELDS
    displayName: Decolorize Fields
    componentType: input
    componentProps:
      required: false
      type: text
      tooltip: Comma-separated fields from which to remove ANSI colors.
  - name: VICTORIA_LOGS_PRESERVE_JSON_KEYS
    displayName: Preserve JSON Keys
    componentType: input
    componentProps:
      required: false
      type: text
      tooltip: Comma-separated JSON keys to preserve without flattening.
