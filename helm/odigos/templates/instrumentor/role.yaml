apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odigos-instrumentor
  namespace: '{{ .Release.Namespace }}'
  labels:
    odigos.io/system-object: "true"
rules:
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - ''
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments/status
    verbs:
      - get
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - odigos.io
    resources:
      - collectorsgroups
    verbs:
      - get
      - list
      - create
      - patch
      - update
      - watch
      - delete
  - apiGroups:
      - odigos.io
    resources:
      - collectorsgroups/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - odigos.io
    resources:
      - destinations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - odigos.io
    resources:
      - destinations/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - odigos.io
    resources:
      - instrumentationrules
      - processors
    verbs:
      - get
      - list
      - watch
      - patch
      - update
      - delete
      - create
  - apiGroups:
      - odigos.io
    resources:
      - processors/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - odigos.io
    resources:
      - instrumentationrules/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - odigos.io
    resources:
      - actions
    verbs:
      - get
      - list
      - watch
      - patch
      - update
      - delete
      - create
  - apiGroups:
      - odigos.io
    resources:
      - samplings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - odigos.io
    resources:
      - actions/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - odigos.io
    resources:
      - recommendations
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - odigos.io
    resources:
      - recommendations/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - actions.odigos.io
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups:
      - actions.odigos.io
    resources:
      - '*/status'
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - odigos.io
    resources:
      - samplings/status
    verbs:
      - get
      - patch
      - update

  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - instrumentor-webhooks-cert
    verbs:
      - update
# migration from the old webhook cert - this can be removed once we are confident that the old secrets have been deleted
  - apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - autoscaler-webhook-cert
      - autoscaler-webhooks-cert
    verbs:
      - delete
  - apiGroups:
      - apps
    resources:
      - daemonsets
    resourceNames:
      - odiglet
    verbs:
      - get
      - list
      - watch
{{- if .Values.openshift.enabled }}
  - apiGroups:
      - 'apps'
    resources:
      - deployments/finalizers
    verbs:
      - update
{{- end }}
# goAutoOffsetsMode and goAutoOffsetsCron are not helm-only: the UI and central remote config write
# them into effective-config at runtime, so these permissions cannot be gated on the helm value.
  - apiGroups:
      - 'batch'
    resources:
      - cronjobs
    resourceNames:
      - 'odigos-go-offsets-updater'
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - 'batch'
    resources:
      - 'jobs'
    verbs:
      - 'create'
