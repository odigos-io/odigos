{{- $imageTag := .Values.image.tag | default .Chart.AppVersion -}}
{{- $extendedSuffix := "" -}}
{{- if and .Values.odiglet.extended (include "odigos.secretExists" .) -}}
  {{- $extendedSuffix = "-extended" -}}
{{- end -}}
{{- $odigletImageTag := printf "%s%s" $imageTag $extendedSuffix -}}
{{- $signals := .Values.signals | default (list "traces") -}}
{{- $collectLogs := has "logs" $signals -}}
{{- $collectMetrics := has "metrics" $signals -}}
{{- $hostMetricsDisabled := false -}}
{{- $networkMetricsEnabled := false -}}
{{- if .Values.metricsSources -}}
  {{- if .Values.metricsSources.hostMetrics -}}
    {{- if hasKey .Values.metricsSources.hostMetrics "disabled" -}}
      {{- $hostMetricsDisabled = .Values.metricsSources.hostMetrics.disabled -}}
    {{- end -}}
  {{- end -}}
  {{- if .Values.metricsSources.networkMetrics -}}
    {{- if hasKey .Values.metricsSources.networkMetrics "enabled" -}}
      {{- $networkMetricsEnabled = .Values.metricsSources.networkMetrics.enabled -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $privilegedRequired := or $collectLogs $collectMetrics -}}
{{- $k8sVersion := include "utils.cleanKubeVersion" . }}
{{- $profile := .Values.odiglet.securityProfile | default "legacy" -}}
{{- $tracefsHostPath := .Values.odiglet.tracefsHostPath | default "/sys/kernel" -}}
{{- $unprivileged := or .Values.odiglet.unPrivileged (ne $profile "legacy") -}}
{{- /* The host mounts are orthogonal to the privilege profile: noHostPathMounts
       withholds them and nothing else does, so unprivileged, noHostPathMounts,
       and both together are three separate choices. */ -}}
{{- $hostPathMounts := not .Values.odiglet.noHostPathMounts -}}
{{- $runAsUser := 1000 -}}
{{- /* The capability sets, in order of increasing authority: what the legacy
       boolean has always granted, what a profile grants, and what an operator
       asked for explicitly. */ -}}
{{- $odigletCaps := list "SYS_ADMIN" "BPF" "PERFMON" "SYS_PTRACE" "DAC_READ_SEARCH" "IPC_LOCK" "SYS_RESOURCE" -}}
{{- $dataCollectionCaps := list "SYS_ADMIN" "BPF" "PERFMON" "IPC_LOCK" -}}
{{- if ne $profile "legacy" -}}
  {{- /* CAP_DAC_OVERRIDE alone, not CAP_FOWNER and not alongside
         CAP_DAC_READ_SEARCH, which it subsumes: it bypasses the read and
         search checks as well as the write. The tracing filesystem's root is
         0700 and uprobe_events 0600, both root's, and the agent reaches them
         by being excused from the permission check rather than by widening
         the modes and putting them back - so nothing the rest of the node can
         see ever changes. It is also what writes the agent directory and the
         device plugin socket, hostPaths the kubelet creates owned by root
         that fsGroup does not apply to, and what reads a target's
         /proc/<pid>/environ. */ -}}
  {{- $odigletCaps = list "BPF" "PERFMON" "SYS_PTRACE" "DAC_OVERRIDE" -}}
  {{- $dataCollectionCaps = list -}}
{{- end -}}
{{- with .Values.odiglet.odiglet.capabilities -}}{{- $odigletCaps = . -}}{{- end -}}
{{- with .Values.odiglet.dataCollection.capabilities -}}{{- $dataCollectionCaps = . -}}{{- end -}}
{{- $wasp := or .Values.wasp.enabled (ne $profile "legacy") -}}
{{- /* The unprivileged attach interfaces are an enterprise capability. An OSS
       deployment gets the legacy profile, which is what it has always had. */ -}}
{{- if and (ne $profile "legacy") (not (include "odigos.secretExists" .)) }}
{{ fail (printf "odiglet.securityProfile=%s requires Odigos Enterprise; set onPremToken, or use securityProfile=legacy" $profile) }}
{{- end }}
{{- if and $privilegedRequired $unprivileged }}
{{ fail "privileged mode is required when collecting logs or metrics, this is currently not supported in unprivileged mode" }}
{{- end }}
{{- if and $networkMetricsEnabled .Values.odiglet.noHostNetwork }}
{{ fail "odiglet.noHostNetwork cannot be true when metricsSources.networkMetrics.enabled is true, since OBI network metrics require hostNetwork" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: odiglet
    odigos.io/system-object: "true"
  name: {{ .Values.odiglet.daemonsetName | default "odiglet" }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: odiglet
  updateStrategy:
    rollingUpdate:
      {{- if semverCompare ">=1.22.0" $k8sVersion }}
      maxSurge: 0
      {{- end }}
      maxUnavailable: 50%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odiglet
        odigos.io/collector-role: NODE_COLLECTOR
      annotations:
        {{- if and $unprivileged (semverCompare "<1.30.0" $k8sVersion) }}
        # Prior to Kubernetes v1.30, AppArmor profile was specified through annotations.
        container.apparmor.security.beta.kubernetes.io/odiglet: unconfined
        {{- end }}
        kubectl.kubernetes.io/default-container: odiglet
    spec:
      {{- if .Values.odiglet.nodeSelector }}
      # Component-specific nodeSelector (overrides global values.yaml nodeSelector)
      nodeSelector:
      {{- toYaml .Values.odiglet.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      # Global nodeSelector from values.yaml
      nodeSelector:
      {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if ne $profile "legacy" }}
      securityContext:
        fsGroup: {{ $runAsUser }}
      {{- end }}
      # we will always have at least one init container
      # if the mountMethod is k8s-init-container, we will pre-pull the agents image here as an init container
      # otherwise, we must be using a mountMethod that allows hostPathMounts and we will use the standard odiglet init
      initContainers:
      {{- if (not (eq .Values.instrumentor.mountMethod "k8s-init-container")) }}
        - name: init
          {{- if include "odigos.secretExists" . }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Component" "enterprise-odiglet" "Tag" $odigletImageTag) }}
          {{- else }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Component" "odiglet" "Tag" $imageTag) }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/odiglet
          args:
            - init
          volumeMounts:
          {{- if $hostPathMounts }}
            - name: odigos
              mountPath: /var/odigos
          {{- if .Values.openshift.enabled }}
            - name: host
              mountPath: /host
              readOnly: true
            - name: selinux
              mountPath: /host/etc/selinux
              mountPropagation: Bidirectional
          {{- end }}
          {{- end }}
          securityContext:
          {{- if not $unprivileged }}
            privileged: true
          {{- end }}
          {{- if ne $profile "legacy" }}
            runAsUser: {{ $runAsUser }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              {{- if $hostPathMounts }}
              add:
                - DAC_OVERRIDE
              {{- end }}
          {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: ODIGOS_TIER
              valueFrom:
                configMapKeyRef:
                  key: ODIGOS_TIER
                  name: odigos-deployment
            - name: CURRENT_NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: init
                  resource: limits.cpu
            {{- if .Values.gke.autopilot }}
            - name: GKE_AUTOPILOT
              value: "true"
            {{- end }}
          resources:
{{ toYaml .Values.odiglet.initContainerResources | indent 12 }}
      {{- end }}
      {{- if eq .Values.instrumentor.mountMethod "k8s-init-container" }}
        # This init container pre-pulls the odigos-agents image to the node
        # so it's available in the image cache when user pods need it
        - name: odigos-agents-image-pull
          {{- if include "odigos.secretExists" . }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Component" "enterprise-agents" "Tag" $odigletImageTag) }}
          {{- else }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Component" "agents" "Tag" $imageTag) }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          {{- if $unprivileged }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            {{- /* It runs nothing, so it needs no uid of its own; naming one is
                   what keeps a profile's promise that no container in this
                   daemonset runs as root. */}}
            {{- if ne $profile "legacy" }}
            runAsUser: {{ $runAsUser }}
            {{- end }}
          {{- end }}
          # # it does not run any actual code, just pulls the image
          # we add the resources here to make sure any policy that may validate resources exist
          # is satisfied, there should be no need to configure this as this is not running anything.
          # NOTE: memory limit is set to 12Mi which is the OpenShift minimum
          # (https://docs.redhat.com/en/documentation/openshift_container_platform/4.20/html/nodes/working-with-clusters#nodes-cluster-resource-configure-about_nodes-cluster-resource-configure);
          # going lower causes kubelet to reject the pod with "set memory limit ... too low".
          resources:
            requests:
              cpu: 1m
              memory: 12Mi
            limits:
              cpu: 1m
              memory: 12Mi
      {{- end }}
      containers:
        - name: odiglet
          {{- if include "odigos.secretExists" . }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Component" "enterprise-odiglet" "Tag" $odigletImageTag) }}
          {{- else }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Component" "odiglet" "Tag" $imageTag) }}
          {{- end }}
          args:
            - --health-probe-bind-port={{ .Values.odiglet.odiglet.livenessProbe.httpGet.port }}
          {{- if .Values.odiglet.traceIdSuffix }}
            - --trace-id-suffix={{ .Values.odiglet.traceIdSuffix }}
          {{- end }}
          {{- if $wasp }}
            - --wasp-enabled
          {{- end }}
          command:
            - /usr/local/bin/odiglet
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- if not $unprivileged }}
            privileged: true
            {{- else }}
            privileged: false
            {{- if ne $profile "legacy" }}
            runAsUser: {{ $runAsUser }}
            runAsGroup: {{ $runAsUser }}
            # Deliberate. A uid change at exec clears the permitted set, so a
            # non-root process receives capabilities only from the binary's
            # file attributes, and no_new_privs is exactly what makes the
            # kernel ignore them. Only the profiles run non-root;
            # odiglet.unPrivileged never did.
            allowPrivilegeEscalation: true
            {{- end }}
            capabilities:
              {{- with $odigletCaps }}
              add:
              {{- toYaml . | nindent 14 }}
              {{- end }}
              drop:
                - ALL
            {{- /* An SELinux-enforcing node may confine the odiglet to a domain
                   that cannot inspect the processes it instruments, whatever
                   capabilities it holds, because the LSM is checked before the
                   DAC. Bottlerocket is the case in hand: its container_t denies
                   even "search" on another process's /proc directory, and
                   control_t is the narrowest of its three types that does not.
                   Set per deployment rather than derived from a platform flag,
                   because the domain that works is the node's policy to
                   decide and not something a chart can know. */ -}}
            {{- with .Values.odiglet.odiglet.seLinuxOptions }}
            seLinuxOptions:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            # for Kubernetes >= 1.30 we can specify AppArmor profile in securityContext
            {{- if semverCompare ">=1.30.0" $k8sVersion }}
            {{- with .Values.odiglet.odiglet.appArmorProfile }}
            appArmorProfile:
              {{ toYaml . | nindent 14 }}
            {{- end }}
            {{- end }}
            {{- end }} # end of securityContext
          livenessProbe:
{{ toYaml .Values.odiglet.odiglet.livenessProbe | indent 12 }}
          readinessProbe:
{{ toYaml .Values.odiglet.odiglet.readinessProbe | indent 12 }}
          resources:
{{ include "odigos.odiglet.resolvedResources" . | indent 12 }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- if .Values.odiglet.customContainerRuntimeSocketPath }}
            - name: CONTAINER_RUNTIME_SOCK
              value: {{ .Values.odiglet.customContainerRuntimeSocketPath }}
          {{- end }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CURRENT_NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_LOG_LEVEL
              value: info
            - name: ODIGOS_LOG_LEVEL
              value: {{ .Values.odiglet.logLevel | default .Values.logLevel | default "info" | quote }}
          {{- if include "odigos.secretExists" . }}
            - name: OTEL_GO_OFFSETS_FILE
              value: /offsets/go_offset_results.json
            - name: ODIGOS_ONPREM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: odigos-pro
                  key: odigos-onprem-token
          {{- end }}
            - name: GOMEMLIMIT
              value: {{ include "odigos.odiglet.gomemlimit" . }}
          {{- if .Values.odiglet.noHostPid }}
            - name: ODIGOS_PROC_DIR
              value: /hostproc
          {{- end}}
          {{- if $hostPathMounts }}
            - name: ODIGOS_CGROUP_ROOT
              value: /host/sys/fs/cgroup
          {{- end }}
          {{- if .Values.odiglet.disableGoCodeAttributes }}
            - name: ODIGOS_GO_DISABLE_CODE_ATTRIBUTES
              value: "true"
          {{- end}}
          envFrom:
            - configMapRef:
                name: odigos-own-telemetry-otel-config
                optional: true
          volumeMounts:
          {{- if $hostPathMounts }}
            - name: run-dir
              mountPath: /run
             {{- if .Values.odiglet.customContainerRuntimeSocketPath }}
            - name: custom-container-runtime-socket
              mountPath: {{ dir .Values.odiglet.customContainerRuntimeSocketPath }}
             {{- end }}
             {{- if .Values.openshift.enabled }}
            - name: host
              mountPath: /host
              readOnly: true
            - name: selinux
              mountPath: /host/etc/selinux
              mountPropagation: Bidirectional
             {{- end }}
            - name: odigos
              mountPath: /var/odigos
              readOnly: true
            # OpAMP Unix socket lives under /var/odigos/exchange on the host; must be writable
            # while the parent /var/odigos mount stays read-only for agent binaries.
            - name: odigos-opamp-exchange
              mountPath: /var/odigos/exchange
            - name: host-cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
          {{- end }} # end of optional hostPath mounts
          {{- if .Values.odiglet.noHostPid }}
            - name: hostproc
              mountPath: /hostproc
          {{- end }}
             # needed to load eBPF tracepoints - used by runtime-detector
            - name: sys-kernel
              mountPath: {{ $tracefsHostPath }}
            - name: odigos-go-offsets
              mountPath: /offsets
            - name: exchange-dir
              mountPath: /var/exchange
        - name: data-collection
          {{- if include "odigos.secretExists" . }}
          image: '{{ template "utils.imageName" (dict "Values" .Values "Component" "enterprise-collector" "Tag" $imageTag) }}'
          {{- else }}
          image: '{{ template "utils.imageName" (dict "Values" .Values "Component" "collector" "Tag" $imageTag) }}'
          {{- end }}
          imagePullPolicy: IfNotPresent
          command:
            - /odigosotelcol
          args:
            - --config=k8scm:{{ .Release.Namespace }}/odigos-data-collection/conf
            - --feature-gates=service.profilesSupport
          securityContext:
            {{- if $privilegedRequired }}
            privileged: true
            {{- else }}
            privileged: false
            {{- if ne $profile "legacy" }}
            runAsUser: {{ $runAsUser }}
            runAsGroup: {{ $runAsUser }}
            allowPrivilegeEscalation: false
            {{- end }}
            capabilities:
              {{- with $dataCollectionCaps }}
              add:
              {{- toYaml . | nindent 14 }}
              {{- end }}
              drop:
                - ALL
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
{{- $nodeLimiter := include "collector.node.memoryLimiter" . | fromYaml }}
            - name: GOMEMLIMIT
              value: "{{ $nodeLimiter.goMiB }}MiB"
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: data-collection
                  resource: limits.cpu
          {{- if include "odigos.secretExists" . }}
            # Verified at startup by the enterprise collector's odigos_enterprise_auth extension.
            - name: ODIGOS_ONPREM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: odigos-pro
                  key: odigos-onprem-token
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 13133
            failureThreshold: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "{{ include "collector.node.memoryRequest" . }}Mi"
              cpu: "{{ include "collector.node.cpuRequest" . }}m"
            limits:
              memory: "{{ include "collector.node.memoryLimit" . }}Mi"
              cpu: "{{ include "collector.node.cpuLimit" . }}m"
          volumeMounts:
            {{- if $collectLogs }}
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            {{- $logsDir := .Values.collectorNode.k8sNodeLogsDirectory | default "" -}}
            {{- if $logsDir }}
            - name: logs-symlink-target
              mountPath: {{ $logsDir }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if and $collectMetrics (not $hostMetricsDisabled) }}
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
            {{- end }}
            - name: sys-kernel
              mountPath: {{ $tracefsHostPath }}
              readOnly: true
            - name: exchange-dir
              mountPath: /var/exchange
# if hostMounts are not allowed we must use mountMethod of "k8s-init-container"
{{- if and (not (eq .Values.instrumentor.mountMethod "k8s-init-container")) (not $hostPathMounts) }}
{{ fail "if HostPath mounts are not allowed mount method must be k8s-init-container" }}
{{- end }}
# to use device plugins we need to have the "k8s-virtual-device" mount method or non specified (default)
# and to have hostMounts allowed
{{- if or (eq .Values.instrumentor.mountMethod "") (eq .Values.instrumentor.mountMethod "k8s-virtual-device") }}
        - name: deviceplugin
          {{- if include "odigos.secretExists" . }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Component" "enterprise-odiglet" "Tag" $odigletImageTag) }}
          {{- else }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Component" "odiglet" "Tag" $imageTag) }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/deviceplugin
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              {{- if and (ne $profile "legacy") $hostPathMounts }}
              add:
                - DAC_OVERRIDE
              {{- end }}
            {{- if ne $profile "legacy" }}
            runAsUser: {{ $runAsUser }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CURRENT_NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ODIGOS_LOG_LEVEL
              value: {{ .Values.odiglet.logLevel | default .Values.logLevel | default "info" | quote }}
          volumeMounts:
            - name: device-plugins-dir
              mountPath: /var/lib/kubelet/device-plugins
          resources:
{{ toYaml .Values.odiglet.deviceplugin.resources | indent 12 }}
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/grpc_health_probe
                - -addr=unix:///var/lib/kubelet/device-plugins/instrumentation.odigos.io_generic
                - -connect-timeout=10s
                - -rpc-timeout=10s
{{- toYaml .Values.odiglet.deviceplugin.livenessProbe | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/grpc_health_probe
                - -addr=unix:///var/lib/kubelet/device-plugins/instrumentation.odigos.io_generic
                - -connect-timeout=10s
                - -rpc-timeout=10s
{{- toYaml .Values.odiglet.deviceplugin.readinessProbe | nindent 12 }}
{{- end }}
# CSI driver is only supported in privileged mode
{{- if and (eq .Values.instrumentor.mountMethod "k8s-csi-driver") $unprivileged }}
{{ fail "CSI driver mount method requires privileged mode, this is not supported in unprivileged mode" }}
{{- end }}
{{- if eq .Values.instrumentor.mountMethod "k8s-csi-driver" }}
        - name: csi-driver
          {{- if include "odigos.secretExists" . }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Component" "enterprise-odiglet" "Tag" $imageTag) }}
          {{- else }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Component" "odiglet" "Tag" $imageTag) }}
          {{- end }}
          command:
            - /usr/local/bin/odigos-csi-driver
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: csi-socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: registration-dir
              mountPath: /registration
            {{- if $hostPathMounts }}
            - name: odigos
              mountPath: /var/odigos
            {{- end }}
          resources:
{{- toYaml .Values.odiglet.csidriver.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/grpc_health_probe
                - -addr=unix:///csi/csi.sock
                - -connect-timeout=10s
                - -rpc-timeout=10s
{{- toYaml .Values.odiglet.csidriver.livenessProbe | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/grpc_health_probe
                - -addr=unix:///csi/csi.sock
                - -connect-timeout=10s
                - -rpc-timeout=10s
{{- toYaml .Values.odiglet.csidriver.readinessProbe | nindent 12 }}
{{- end }}
      # set hostNetwork for k8s versions prior to v1.26 (unless noHostNetwork), or when OBI network metrics infrastructure is enabled
      {{- if or (and (semverCompare "<1.26.0" $k8sVersion) (not .Values.odiglet.noHostNetwork)) $networkMetricsEnabled }}
      hostNetwork: true
      {{- end}}
      {{- if not .Values.odiglet.noHostPid }}
      hostPID: true
      {{- end }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.odiglet.priorityClassName }}
      priorityClassName: {{ .Values.odiglet.priorityClassName }}
      {{- end }}
      serviceAccountName: odiglet
      volumes:
        {{- if $collectLogs }}
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        {{- $logsDir := .Values.collectorNode.k8sNodeLogsDirectory | default "" -}}
        {{- if $logsDir }}
        - name: logs-symlink-target
          hostPath:
            path: {{ $logsDir }}
        {{- end }}
        {{- end }}
        {{- if and $collectMetrics (not $hostMetricsDisabled) }}
        - name: hostfs
          hostPath:
            path: /
        {{- end }}
      {{- if $hostPathMounts }}
        - name: run-dir
          hostPath:
            path: /run
         {{- if .Values.odiglet.customContainerRuntimeSocketPath }}
        - name: custom-container-runtime-socket
          hostPath:
            path: {{ dir .Values.odiglet.customContainerRuntimeSocketPath }}
         {{- end }}
         {{- if .Values.openshift.enabled }}
        - name: host
          hostPath:
            path: /
        - name: selinux
          hostPath:
            path: /etc/selinux
         {{- end }}
        - name: device-plugins-dir
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: odigos
          hostPath:
            path: /var/odigos
        - name: odigos-opamp-exchange
          hostPath:
            path: /var/odigos/exchange
            type: DirectoryOrCreate
{{- if eq .Values.instrumentor.mountMethod "k8s-csi-driver" }}
        # CSI Driver volumes
        - name: csi-socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/odigos.csi.driver
            type: DirectoryOrCreate
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
{{- end }}
      {{- end }} # end of hostPath mounts that are not mandatory
        # needed to load eBPF tracepoints - used by runtime-detector
      {{- if .Values.odiglet.noHostPid }}
        - name: hostproc
          hostPath:
            path: /proc
            type: Directory
      {{- end }}
        - name: sys-kernel
          hostPath:
            path: {{ $tracefsHostPath }}
      {{- if $hostPathMounts }}
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
      {{- end }}
        - name: odigos-go-offsets
          configMap:
            name: odigos-go-offsets
        - name: exchange-dir
          emptyDir: {}
      {{ include "odigos.renderPullSecrets" . | nindent 6 }}
{{- with .Values.odiglet }}
  {{- if .tolerations }}
      tolerations: {{ toYaml .tolerations | nindent 8 }}
  {{- end }}
  {{- if .affinity }}
      affinity: {{ toYaml .affinity | nindent 8 }}
  {{- end }}
{{- end }}
