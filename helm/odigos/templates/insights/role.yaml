{{- if and .Values.insights.enabled (include "odigos.secretExists" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odigos-insights
  namespace: {{ .Release.Namespace }}
  labels:
    odigos.io/system-object: "true"
rules:
  # The skeleton only needs to read its own configmap; future PRs that surface
  # cluster context to the scoring engine will extend this list explicitly.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  # Singleton jobs (findings notifier, recommendation sweeps) run on exactly one
  # replica, elected through a Lease (odigos-insights-leader).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
{{- end }}
