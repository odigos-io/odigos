{{- if and (include "odigos.litellmEnabled" .) (include "odigos.secretExists" .) .Values.insights.interrogation.litellm.bootstrapConfig }}
{{- $apiBase := include "odigos.interrogationApiBase" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: odigos-litellm
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: odigos-litellm
    odigos.io/system-object: "true"
data:
  config.yaml: |
    model_list:
      - model_name: interrogation
        litellm_params:
          model: {{ printf "%s/%s" (include "odigos.interrogationModelProvider" .) (include "odigos.interrogationModelName" .) | quote }}
          api_key: os.environ/LITELLM_UPSTREAM_API_KEY
          {{- if $apiBase }}
          api_base: {{ $apiBase | quote }}
          {{- end }}
    litellm_settings:
      drop_params: true
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
{{- end }}
