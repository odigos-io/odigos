{{- if and .Values.insights.enabled (include "odigos.secretExists" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odigos-insights-clickhouse
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: odigos-insights-clickhouse
    odigos.io/system-object: "true"
spec:
  replicas: 1
  # Recreate (not RollingUpdate) because a single ReadWriteOnce PVC can
  # only be attached to one pod at a time. A rolling update would deadlock
  # waiting for the old pod's PVC to detach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: odigos-insights-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odigos-insights-clickhouse
    spec:
      {{- if .Values.insights.clickhouse.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.insights.clickhouse.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.insights.clickhouse.priorityClassName }}
      priorityClassName: {{ .Values.insights.clickhouse.priorityClassName }}
      {{- end }}
      {{ include "odigos.renderPullSecrets" . | nindent 6 }}
      containers:
        - name: clickhouse
          # User and database name stay hardcoded (odigos_insights). Image,
          # resources, and scheduling are values-driven. When BYO ClickHouse
          # support is added, switch the insights service to an external DSN
          # secret and drop this Deployment.
          image: "{{ .Values.insights.clickhouse.image.repository }}:{{ .Values.insights.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.insights.clickhouse.image.pullPolicy }}
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
          env:
            - name: CLICKHOUSE_USER
              value: odigos_insights
            - name: CLICKHOUSE_DB
              value: odigos_insights
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odigos-insights-clickhouse
                  key: password
            # Let the bootstrap user manage its own grants; without this the
            # image creates the user with no privileges and every query fails.
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          # ClickHouse exposes an unauthenticated /ping on the HTTP port that
          # returns 200 once it's accepting queries — cheaper and less brittle
          # than an auth'd native-protocol probe.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          # No livenessProbe on purpose. Liveness probes on a single-replica
          # datastore are an antipattern: a slow merge under load can trip the
          # probe and kubelet will kill the process mid-write. If ClickHouse
          # really dies, the Deployment controller restarts the pod anyway.
          resources:
            requests:
              cpu: {{ .Values.insights.clickhouse.resources.requests.cpu }}
              memory: {{ .Values.insights.clickhouse.resources.requests.memory }}
            limits:
              cpu: {{ .Values.insights.clickhouse.resources.limits.cpu }}
              memory: {{ .Values.insights.clickhouse.resources.limits.memory }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      {{- with .Values.insights.clickhouse.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.insights.clickhouse.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: odigos-insights-clickhouse
{{- end }}
