{{- if and .Values.centralProxy.connectionToken (not .Values.centralProxy.connectionTokenSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: central-proxy-connection-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: central-proxy
    odigos.io/system-object: "true"
type: Opaque
stringData:
  token: {{ .Values.centralProxy.connectionToken | quote }}
{{- end }}
