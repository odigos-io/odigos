{{- if include "cacheDb.enabled" . | eq "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odigos-cache
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: odigos-cache
    odigos.io/system-object: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: odigos-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odigos-cache
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{ include "odigos.renderPullSecrets" . | nindent 6 }}
      containers:
        - name: cache
          image: {{ .Values.cacheDb.image | quote }}
          command: ["redis-server"]
          args:
            - "--port"
            - "6379"
            - "--maxmemory"
            - {{ include "cacheDb.resolvedMaxmemory" . | quote }}
            {{- if .Values.cacheDb.maxmemoryPolicy }}
            - "--maxmemory-policy"
            - "{{ .Values.cacheDb.maxmemoryPolicy }}"
            {{- end }}
            - "--tcp-keepalive"
            - "30"
          ports:
            - name: cache
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "6379", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "6379", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- include "cacheDb.resolvedResources" . | nindent 12 }}
{{- end }}
