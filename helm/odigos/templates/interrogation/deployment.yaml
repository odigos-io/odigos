{{- if and .Values.interrogation.enabled (include "odigos.secretExists" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odigos-interrogation
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: odigos-interrogation
    odigos.io/system-object: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: odigos-interrogation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odigos-interrogation
    spec:
      serviceAccountName: odigos-interrogation
      {{- if .Values.interrogation.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.interrogation.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.interrogation.priorityClassName }}
      priorityClassName: {{ .Values.interrogation.priorityClassName }}
      {{- end }}
      {{ include "odigos.renderPullSecrets" . | nindent 6 }}
      containers:
        - name: odigos-interrogation
          {{ $imageTag := .Values.image.tag | default .Chart.AppVersion }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Release" .Release "Component" "enterprise-interrogation" "Tag" $imageTag) }}
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: pprof
              containerPort: 6060
          env:
            - name: CURRENT_NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ODIGOS_LOG_LEVEL
              value: {{ .Values.interrogation.logLevel | default .Values.logLevel | default "info" | quote }}
            - name: ODIGOS_ONPREM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: odigos-pro
                  key: odigos-onprem-token
            - name: GOMEMLIMIT
              value: {{ include "odigos.gomemlimitFromResources" (dict "Resources" .Values.interrogation.resources) }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odigos-insights-clickhouse
                  key: password
            - name: CLICKHOUSE_DSN
              value: "clickhouse://odigos_insights:$(CLICKHOUSE_PASSWORD)@odigos-insights-clickhouse:9000/interrogation"
            - name: INTERROGATION_LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: odigos-litellm
                  key: master-key
            - name: INTERROGATION_AUTO_APPLY
              value: {{ .Values.interrogation.model.autoApply | default false | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.interrogation.resources.requests.cpu }}
              memory: {{ .Values.interrogation.resources.requests.memory }}
            limits:
              cpu: {{ .Values.interrogation.resources.limits.cpu }}
              memory: {{ .Values.interrogation.resources.limits.memory }}
      {{- with .Values.interrogation.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.interrogation.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
