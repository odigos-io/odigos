{{- if and (include "odigos.vllmEnabled" .) (include "odigos.secretExists" .) (ne .Values.interrogation.vllm.storage.persistence false) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odigos-vllm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: odigos-vllm
    odigos.io/system-object: "true"
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.interrogation.vllm.storage.storageClassName }}
  storageClassName: {{ .Values.interrogation.vllm.storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.interrogation.vllm.storage.size | default "50Gi" }}
{{- end }}
