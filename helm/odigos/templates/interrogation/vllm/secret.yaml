{{- if and (include "odigos.vllmEnabled" .) (include "odigos.secretExists" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "odigos-vllm" }}
apiVersion: v1
kind: Secret
metadata:
  name: odigos-vllm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: odigos-vllm
    odigos.io/system-object: "true"
type: Opaque
data:
  {{- if .Values.interrogation.vllm.hfToken }}
  hf-token: {{ .Values.interrogation.vllm.hfToken | b64enc | quote }}
  {{- else if and $existing $existing.data (index $existing.data "hf-token") }}
  hf-token: {{ index $existing.data "hf-token" }}
  {{- else }}
  hf-token: {{ "" | b64enc | quote }}
  {{- end }}
{{- end }}
