{{- if ne .Values.goAutoOffsetsMode "off" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odigos-go-offsets-updater
  namespace: '{{ .Release.Namespace }}'
  labels:
    odigos.io/system-object: "true"
rules:
  - apiGroups:
      - ''
    resources:
      - configmaps
    resourceNames:
      - odigos-go-offsets
    verbs:
      - get
      - update
  - apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - odigos-pro
    verbs:
      - get
{{- end }}
