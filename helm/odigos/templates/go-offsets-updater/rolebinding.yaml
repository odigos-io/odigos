{{- if ne .Values.goAutoOffsetsMode "off" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odigos-go-offsets-updater
  namespace: {{ .Release.Namespace }}
  labels:
    odigos.io/system-object: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odigos-go-offsets-updater
subjects:
  - kind: ServiceAccount
    name: odigos-go-offsets-updater
    namespace: {{ .Release.Namespace }}
{{- end }}
