# goAutoOffsetsMode and goAutoOffsetsCron are not helm-only: the UI and central remote config write
# them into effective-config at runtime, so this cannot be gated on the helm value.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: odigos-go-offsets-updater
  namespace: {{ .Release.Namespace }}
  labels:
    odigos.io/system-object: "true"
