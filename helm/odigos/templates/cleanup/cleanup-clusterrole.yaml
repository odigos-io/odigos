apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cleanup-clusterrole
  labels:
    odigos.io/system-object: "true"
rules:
- apiGroups: ["odigos.io"]
  resources: ["sources"]
  verbs: ["list", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list", "patch"]
# remove the instrumentor webhook finalizers so helm can delete them after cleanup
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations", "mutatingwebhookconfigurations/finalizers"]
  resourceNames:
    - odigos-pod-mutating-webhook-configuration
    - odigos-source-mutating-webhook-configuration
  verbs: ["get", "update"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingwebhookconfigurations", "validatingwebhookconfigurations/finalizers"]
  resourceNames:
    - odigos-source-validating-webhook-configuration
  verbs: ["get", "update"]

