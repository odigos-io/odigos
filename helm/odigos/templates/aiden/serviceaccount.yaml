{{- if .Values.aiden.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: odigos-aiden
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: odigos-aiden
    odigos.io/system-object: "true"
# Aiden only talks to Gemini, Slack, and the in-cluster MCP endpoint over HTTP(S);
# it never calls the Kubernetes API, so no token needs to be mounted.
automountServiceAccountToken: false
{{- end }}
