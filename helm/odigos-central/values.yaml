# Global image controls
# -- Override image tag for all Odigos components (empty = chart default)
image:
  tag: ''
# -- Prefix/registry for all Odigos images (empty = built-in defaults)
imagePrefix: ''
# -- Image pull secrets for private registries (k8s secret names)
imagePullSecrets: []

# On-prem token for Odigos Enterprise (chart-managed odigos-central secret when set)
# onPremToken: ''

# Set to true when odigos-central is managed externally (GitOps). The chart reads the token from
# the existing odigos-central secret to create the enterprise registry pull secret.
# externalOnpremTokenSecret: false

# Set to true when odigos-enterprise-registry is managed externally (GitOps).
# The chart mounts the existing pull secret but does not create it.
# externalOnpremPullSecret: false

centralBackend:
  # Resources and scheduling for the Central backend
  # -- Maximum WebSocket message size in bytes between central-backend and proxies
  #    (default 33554432 = 32Mi). Raise for very large RemoteFetch payloads.
  maxMessageSize: '33554432'
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  affinity: []
  # HorizontalPodAutoscaler for the backend
  autoscaling:
    # -- Enable HPA for the backend
    enabled: true
    # -- HPA replica bounds
    minReplicas: 1
    maxReplicas: 10
    # -- Target average CPU utilization percentage
    cpuTargetUtilization: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 30
        selectPolicy: Max
        policies:
          percent:
            value: 100
            periodSeconds: 30
          pods:
            value: 2
            periodSeconds: 30
      scaleDown:
        stabilizationWindowSeconds: 600
        selectPolicy: Min
        policies:
          percent:
            value: 10
            periodSeconds: 60
          pods:
            value: 1
            periodSeconds: 60

centralUI:
  # Central UI settings
  uiMode: normal
  uiPaginationLimit: 0
  # -- Override backend URL (empty = in-cluster service)
  centralBackendURL: ''
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  affinity: []

redis:
  image: redis:7.4.2
  port: 6379
  portName: redis
  # Set to ~85% of memory limit to leave headroom for Redis overhead
  # Current: 220mb = 85% of 256Mi limit. Adjust proportionally if changing memory limits.
  maxmemory: 220mb
  # Eviction policy when maxmemory is reached
  # allkeys-lru: evict least recently used keys (good default for mixed use)
  maxmemoryPolicy: allkeys-lru
  # TCP keepalive interval in seconds. Sends probe packets on idle connections to prevent
  # network infrastructure (NAT/firewall) from closing them due to idle timeouts.
  tcpKeepalive: 30

  # Liveness probe settings
  # `redis-cli ping` fails when the server is unresponsive (hung process, OOM),
  # which a TCP check on the port would not catch.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 5
    # Must be 1 for liveness probes
    successThreshold: 1

  # Readiness probe settings
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  affinity: {}

auth:
  # Built-in Keycloak configuration
  enabled: true
  # -- Browser-accessible URL of the central-backend for SSO redirect flows.
  # Configures Keycloak's hostname (for token issuer) and the backend's external URL
  # (for browser-facing Keycloak proxy URLs during sign-in/sign-out).
  # Examples:
  #   Port-forward (default): 'http://localhost:8081'
  #   Production with ingress: 'https://central.example.com'
  # When empty, defaults to 'http://localhost:8081' (suitable for port-forward / local dev).
  externalUrl: ''
  # -- Browser-accessible URL of the Central UI for OAuth redirect_uri (/signin).
  # When empty, defaults to auth.externalUrl, except for local port-forward
  # (http://localhost:8081) where the UI is reached on port 3000.
  externalUIUrl: ''
  image: registry.odigos.io/keycloak:24.0.3
  adminUsername: admin
  # -- Keycloak admin password for internal API access.
  # On first install: uses this value, or auto-generates if empty.
  # On upgrades: ignores this value and reuses the existing password from the secret
  # to prevent mismatch with Keycloak's stored credentials.
  adminPassword: ''
  port: 8080
  portName: http
  # Ensure volume permissions are compatible when persistence is enabled
  podSecurityContext:
    enabled: true
    fsGroup: 1000
  securityContext:
    enabled: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false

  # Persistence (disabled by default). Enable to keep Keycloak data via PVC.
  # ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  persistence:
    enabled: false
    size: 1Gi
    # -- PVC access modes
    # See: kubectl explain persistentvolumeclaim.spec.accessModes
    accessModes:
      - ReadWriteOnce
    # -- Storage class behavior:
    #    - Omit key to use the cluster default (if any)
    #    - Set to a class name to bind to that class
    storageClassName: ''
    # -- Use an existing PVC by name instead of creating one
    # If set, the chart will not create a PVC and will mount this claim
    existingClaim: ''

  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Limits Keycloak's JVM memory to a small, efficient range suitable for medium traffic
  javaOpts: '-Xms128m -Xmx256m'

  # Startup probe settings
  # Absorbs Keycloak's slow JVM boot (up to failureThreshold * periodSeconds = 300s)
  # so the liveness and readiness probes below can use short initial delays.
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    # Must be 1 for startup probes
    successThreshold: 1
    port: 8080

  # Liveness probe settings
  # Keycloak exposes /health/live for liveness checks
  # initialDelaySeconds is 0 because the startup probe already covers boot time.
  # Raise it if startupProbe.enabled is set to false.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
    port: 8080

  # Readiness probe settings
  # Keycloak exposes /health/ready for readiness checks
  readinessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
    port: 8080

  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  affinity: []

# Cloud connectors (platformType = connector). Feature-gated; when disabled, none of the
# connector-runtime controller, PostgreSQL, migration Job or CRD are installed.
cloudConnectors:
  # -- Master switch for the entire cloud-connectors subsystem.
  enabled: false

  # The connector-runtime controller that reconciles OdigosCloudConnector CRs into connector workloads.
  connectorRuntime:
    # -- Override the controller image (empty = built-in odigos-enterprise-connector-runtime).
    image: ''
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    nodeSelector:
      kubernetes.io/os: linux
    tolerations: []
    affinity: {}

  # Provider connector runtime images the controller stamps onto per-account connector Deployments.
  aws:
    # -- Override the AWS connector image (empty = built-in odigos-enterprise-connector-aws).
    image: ''
  gcp:
    # -- Override the GCP connector image (empty = built-in odigos-enterprise-connector-gcp).
    image: ''
  azure:
    # -- Override the Azure connector image (empty = built-in odigos-enterprise-connector-azure).
    image: ''

  # Bundled PostgreSQL (durable store for connector state) + Atlas migrations.
  postgres:
    # -- Override the postgres image (empty = built-in odigos-enterprise-connector-postgres).
    image: ''
    port: 5432
    portName: postgres
    database: odigos_central
    username: odigos
    # -- PostgreSQL password (dev default; override for non-dev installs or use an external secret).
    password: odigos
    persistence:
      enabled: true
      size: 20Gi
      accessModes:
        - ReadWriteOnce
      # -- Storage class (empty = cluster default)
      storageClassName: ''
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    nodeSelector:
      kubernetes.io/os: linux
    tolerations: []
    affinity: {}

# Pod Security Standards "Baseline" settings applied to every pod in this chart.
# `pod` is rendered as the pod-level securityContext, `container` as the container-level
# securityContext of every container in those pods. These controls do not constrain which
# user a container runs as: each image keeps its own default user.
securityContext:
  pod:
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # Per-component overrides, keyed by component name: centralBackend, centralUI, redis,
  # keycloak, connectorRuntime, connectorMigrations, postgres. Each key set under a
  # component replaces that key in the defaults above, for that component only, and
  # setting a key to null drops it.
  #
  # The three components below are exempted from the capability drop. Each runs a
  # third-party image as root, and root without CAP_DAC_OVERRIDE/CAP_CHOWN/CAP_SETUID
  # cannot complete the startup work these images do.
  components:
    # redis-server runs as root (the image sets no USER) with its working directory /data
    # owned by uid 999 mode 0755, so writing the RDB snapshot needs CAP_DAC_OVERRIDE.
    # Without it Redis fails BGSAVE and, with stop-writes-on-bgsave-error, rejects writes.
    redis:
      container:
        capabilities: null
    # The postgres entrypoint runs as root and chowns/chmods PGDATA before dropping to the
    # postgres user via gosu: that needs CAP_CHOWN, CAP_FOWNER, CAP_SETUID and CAP_SETGID.
    postgres:
      container:
        capabilities: null
    # Same image as postgres, entered through run-migrations.sh. The script is built
    # out-of-tree and could not be inspected, so it keeps the postgres exemption.
    connectorMigrations:
      container:
        capabilities: null

# OpenShift-specific toggles (RBAC/SELinux/images)
openshift:
  enabled: false

# GKE-specific toggles (reserved)
gke:
  enabled: false

topologySpreadConstraints: []
