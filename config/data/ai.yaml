apiVersion: internal.odigos.io/v1beta1
kind: Configuration
metadata:
  name: ai
  displayName: AI
spec:
  fields:
    - displayName: Interrogation
      componentType: toggle
      isHelmOnly: true
      isEnterpriseOnly: true
      description: Correlate traces with profiles and analyze them with an LLM served through the bundled LiteLLM proxy. Requires insights and must be set via Helm (insights.interrogation.enabled).
      helmValuePath: interrogation.enabled
    - displayName: Provider
      componentType: dropdown
      isHelmOnly: false
      isEnterpriseOnly: true
      description: The LiteLLM provider prefix used to route requests to the model. The bundled vLLM uses hosted_vllm.
      helmValuePath: interrogation.model.provider
      renderCondition: ["interrogation.enabled", "==", "true"]
      componentProps:
        options:
          - openai
          - anthropic
          - gemini
          - azure
          - bedrock
          - vertex_ai
          - hosted_vllm
    - displayName: Model
      componentType: input
      isHelmOnly: false
      isEnterpriseOnly: true
      description: The provider's model name, without the provider prefix (for example gpt-4o-mini).
      helmValuePath: interrogation.model.name
      renderCondition: ["interrogation.enabled", "==", "true"]
    - displayName: API Base URL
      componentType: input
      isHelmOnly: false
      isEnterpriseOnly: true
      description: Optional base URL of an OpenAI-compatible endpoint for the provider. Leave empty to use the provider's default endpoint.
      helmValuePath: interrogation.model.apiBase
      renderCondition: ["interrogation.enabled", "==", "true"]
    - displayName: API Key
      componentType: input
      isHelmOnly: false
      isEnterpriseOnly: true
      description: The provider API key. Stored in the odigos-litellm Secret and never displayed. Leave empty to keep the current key.
      helmValuePath: interrogation.model.apiKey
      renderCondition: ["interrogation.enabled", "==", "true"]
      componentProps:
        type: password
