apiVersion: internal.odigos.io/v1beta1
kind: Configuration
metadata:
  name: ai
  displayName: AI
spec:
  fields:
    - displayName: AI analysis
      componentType: toggle
      isHelmOnly: false
      isEnterpriseOnly: true
      description: Pause or resume AI analysis. Pausing stops LLM requests and new AI-generated rule changes while evidence collection continues.
      helmValuePath: interrogation.analysisEnabled
      renderCondition: ["interrogation.enabled", "==", "true"]
    - displayName: Provider
      componentType: dropdown
      isHelmOnly: false
      isEnterpriseOnly: true
      description: The LiteLLM provider prefix used to route requests to the model. The bundled vLLM uses hosted_vllm.
      helmValuePath: interrogation.model.provider
      renderCondition: ["interrogation.enabled", "==", "true"]
      componentProps:
        options:
          - openai
          - anthropic
          - gemini
          - azure
          - bedrock
          - vertex_ai
          - hosted_vllm
    - displayName: Model
      componentType: input
      isHelmOnly: false
      isEnterpriseOnly: true
      description: The provider's model name, without the provider prefix (for example gpt-4o-mini).
      helmValuePath: interrogation.model.name
      renderCondition: ["interrogation.enabled", "==", "true"]
    - displayName: API Base URL
      componentType: input
      isHelmOnly: false
      isEnterpriseOnly: true
      description: Optional base URL of an OpenAI-compatible endpoint for the provider. Leave empty to use the provider's default endpoint.
      helmValuePath: interrogation.model.apiBase
      renderCondition: ["interrogation.enabled", "==", "true"]
    - displayName: API Key
      componentType: input
      isHelmOnly: false
      isEnterpriseOnly: true
      description: The provider API key. Stored as a separate UI credential override. The current key can be revealed when UI read-only mode is off. Leave empty to keep the current key; reset to inherit the Helm credential.
      helmValuePath: interrogation.model.apiKey
      renderCondition: ["interrogation.enabled", "==", "true"]
      componentProps:
        type: password
