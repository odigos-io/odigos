apiVersion: internal.odigos.io/v1beta1
kind: Configuration
metadata:
  name: ai-interrogation
  displayName: AI Interrogation
spec:
  fields:
    - displayName: Enabled
      componentType: toggle
      isHelmOnly: true
      isEnterpriseOnly: true
      description: Whether interrogation is installed. Set insights.enabled and insights.interrogation.enabled in the Helm values. Installing it deploys the interrogation pipeline and odigos-litellm.
      helmValuePath: interrogation.enabled
    - displayName: Mode
      componentType: dropdown
      isHelmOnly: false
      isEnterpriseOnly: true
      description: How the interrogation loop runs when interrogation is installed. off does not analyze transactions. auto analyzes them. This does not install or remove interrogation.
      helmValuePath: interrogation.mode
      componentProps:
        options:
          - off
          - auto
    - displayName: Provider
      componentType: input
      isHelmOnly: true
      isEnterpriseOnly: true
      description: LiteLLM provider prefix used to route requests to the model. Set with Helm `insights.interrogation.model.provider`.
      helmValuePath: interrogation.model.provider
      renderCondition: ["interrogation.enabled", "==", "true"]
    - displayName: Model
      componentType: input
      isHelmOnly: true
      isEnterpriseOnly: true
      description: Provider model name, without the provider prefix. Set with Helm `insights.interrogation.model.name`.
      helmValuePath: interrogation.model.name
      renderCondition: ["interrogation.enabled", "==", "true"]
    - displayName: API Base URL
      componentType: input
      isHelmOnly: true
      isEnterpriseOnly: true
      description: Optional OpenAI-compatible endpoint for the provider. Set with Helm `insights.interrogation.model.apiBase`. The API key is set with Helm `insights.interrogation.model.apiKey`.
      helmValuePath: interrogation.model.apiBase
      renderCondition: ["interrogation.enabled", "==", "true"]
