apiVersion: e2e.tests.odigos.io/v1
kind: TraceTest
description: errors 30x /ok — cost-reduction-ok-baseline (10% dry-run)
query: |
  length([?
    span.serviceName == 'tail-sampling-errors' &&
    span.kind == 'server' &&
    span.spanAttributes."http.route" == '/ok' &&
    span.spanAttributes."odigos.sampling.category" == 'cost reduction' &&
    span.spanAttributes."odigos.sampling.dry_run" == `true` &&
    span.spanAttributes."odigos.sampling.span.matching_rule.name" == 'cost-reduction-ok-baseline' &&
    span.spanAttributes."odigos.sampling.span.matching_rule.keep_percentage" == `10` &&
    span.spanAttributes."odigos.sampling.trace.deciding_rule.name" == 'cost-reduction-ok-baseline' &&
    span.spanAttributes."odigos.sampling.trace.deciding_rule.keep_percentage" == `10`
  ]) > `0`
expected:
  count: 30
