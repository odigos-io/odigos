apiVersion: e2e.tests.odigos.io/v1
kind: TraceTest
description: duration 30x /duration/short — cost-reduction-rest (10%)
query: |
  length([?
    span.serviceName == 'tail-sampling-duration' &&
    span.kind == 'server' &&
    span.spanAttributes."http.route" == '/duration/short' &&
    span.spanAttributes."odigos.sampling.category" == 'cost reduction' &&
    span.spanAttributes."odigos.sampling.dry_run" == `true` &&
    span.spanAttributes."odigos.sampling.span.matching_rule.name" == 'cost-reduction-rest' &&
    span.spanAttributes."odigos.sampling.span.matching_rule.keep_percentage" == `10` &&
    span.spanAttributes."odigos.sampling.trace.deciding_rule.name" == 'cost-reduction-rest' &&
    span.spanAttributes."odigos.sampling.trace.deciding_rule.keep_percentage" == `10`
  ]) > `0`
expected:
  count: 30
