apiVersion: e2e.tests.odigos.io/v1
kind: TraceTest
description: http-server templated prefix — high-relevance-http-server-templated-prefix (100%)
query: |
  length([?
    span.serviceName == 'tail-sampling-http-server' &&
    span.kind == 'server' &&
    span.spanAttributes."http.route" == '/http-server/prefix/:id/items' &&
    span.spanAttributes."odigos.sampling.category" == 'highly relevant' &&
    span.spanAttributes."odigos.sampling.dry_run" == `true` &&
    span.spanAttributes."odigos.sampling.span.matching_rule.name" == 'high-relevance-http-server-templated-prefix' &&
    span.spanAttributes."odigos.sampling.span.matching_rule.keep_percentage" == `100` &&
    span.spanAttributes."odigos.sampling.trace.deciding_rule.name" == 'high-relevance-http-server-templated-prefix' &&
    span.spanAttributes."odigos.sampling.trace.deciding_rule.keep_percentage" == `100` &&
    span.spanAttributes."odigos.sampling.trace.kept" == `true`
  ]) > `0`
expected:
  count: 1
