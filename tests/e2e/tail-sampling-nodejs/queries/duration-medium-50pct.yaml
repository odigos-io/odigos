apiVersion: e2e.tests.odigos.io/v1
kind: TraceTest
description: duration 6x /duration/medium — duration-above-500ms (50%)
query: |
  length([?
    span.serviceName == 'tail-sampling-duration' &&
    span.kind == 'server' &&
    span.spanAttributes."http.route" == '/duration/medium' &&
    span.spanAttributes."odigos.sampling.category" == 'highly relevant' &&
    span.spanAttributes."odigos.sampling.dry_run" == `true` &&
    span.spanAttributes."odigos.sampling.span.matching_rule.name" == 'duration-above-500ms' &&
    span.spanAttributes."odigos.sampling.span.matching_rule.keep_percentage" == `50` &&
    span.spanAttributes."odigos.sampling.trace.deciding_rule.name" == 'duration-above-500ms' &&
    span.spanAttributes."odigos.sampling.trace.deciding_rule.keep_percentage" == `50`
  ]) > `0`
expected:
  count: 6
