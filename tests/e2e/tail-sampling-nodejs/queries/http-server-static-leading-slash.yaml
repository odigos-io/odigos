apiVersion: e2e.tests.odigos.io/v1
kind: TraceTest
description: http-server static route with leading / — high-relevance-http-server-static-leading-slash (100%)
query: |
  length([?
    span.serviceName == 'tail-sampling-http-server' &&
    span.kind == 'server' &&
    span.spanAttributes."http.route" == '/http-server/static/leading-slash' &&
    span.spanAttributes."odigos.sampling.category" == 'highly relevant' &&
    span.spanAttributes."odigos.sampling.dry_run" == `true` &&
    span.spanAttributes."odigos.sampling.span.matching_rule.name" == 'high-relevance-http-server-static-leading-slash' &&
    span.spanAttributes."odigos.sampling.span.matching_rule.keep_percentage" == `100` &&
    span.spanAttributes."odigos.sampling.trace.deciding_rule.name" == 'high-relevance-http-server-static-leading-slash' &&
    span.spanAttributes."odigos.sampling.trace.deciding_rule.keep_percentage" == `100` &&
    span.spanAttributes."odigos.sampling.trace.kept" == `true`
  ]) > `0`
expected:
  count: 1
