# Node.js tail-sampling app (nodejs-community instrumentation).
# Image: us-central1-docker.pkg.dev/odigos-cloud/components/nodejs-tail-sampling:v0.0.2
# (built from tests/common/services/nodejs-tail-sampling).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tail-sampling-errors
  namespace: default
  labels:
    app: tail-sampling-errors
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tail-sampling-errors
  template:
    metadata:
      labels:
        app: tail-sampling-errors
    spec:
      containers:
        - name: tail-sampling-errors
          image: us-central1-docker.pkg.dev/odigos-cloud/components/nodejs-tail-sampling:v0.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tail-sampling-errors
  namespace: default
spec:
  selector:
    app: tail-sampling-errors
  ports:
    - protocol: TCP
      port: 8080
---
