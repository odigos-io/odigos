apiVersion: odigos.io/v1alpha1
kind: InstrumentationConfig
metadata:
  name: deployment-shipping
  namespace: default
  (ownerReferences[?kind == 'Deployment' && name == 'shipping']):
    - apiVersion: apps/v1
      kind: Deployment
      name: shipping
  (ownerReferences[?kind == 'Source' && name == 'shipping']):
    - apiVersion: odigos.io/v1alpha1
      kind: Source
      name: shipping
spec:
  agentInjectionEnabled: true
  containers:
    - agentEnabled: true
      containerName: shipping
      otelDistroName: opentelemetry-ebpf-instrumentation
  serviceName: shipping-reported
status:
  runtimeDetailsByContainer:
    - containerName: shipping
      language: cplusplus
