apiVersion: e2e.tests.odigos.io/v1
kind: TraceTest
description: Root server spans for GET /http-match/exact/target (exact route, 50% dry-run)
query: |
  length([?
    span.serviceName == 'head-sampling-http-server' &&
    !parent &&
    span.kind == 'server' &&
    span.spanAttributes."http.route" == '/http-match/exact/target' &&
    span.spanAttributes."odigos.sampling.category" == 'noise' &&
    span.spanAttributes."odigos.sampling.dry_run" == `true` &&
    span.spanAttributes."odigos.sampling.trace.deciding_rule.keep_percentage" == `50`
  ]) > `0`
expected:
  count: 20
