apiVersion: v1
kind: Pod
metadata:
  namespace: default
  labels:
    app: otel-crash-demo
status:
  containerStatuses:
    - name: api
      ready: true
      restartCount: 0
      started: true
  phase: Running
---
apiVersion: odigos.io/v1alpha1
kind: InstrumentationConfig
metadata:
  name: deployment-otel-crash-demo
  namespace: default
  (ownerReferences[?kind == 'Deployment' && name == 'otel-crash-demo']):
    - apiVersion: apps/v1
      kind: Deployment
      name: otel-crash-demo
  (ownerReferences[?kind == 'Source' && name == 'default']):
    - apiVersion: odigos.io/v1alpha1
      kind: Source
      name: default
spec:
  agentInjectionEnabled: false
  containers:
  - agentEnabled: false
    agentEnabledMessage: Pods entered CrashLoopBackOff; instrumentation disabled
    agentEnabledReason: CrashLoopBackOff
    containerName: api
    otelDistroName: nodejs-community
  serviceName: otel-crash-demo
status:
  rollbackOccurred: true
  runtimeDetailsByContainer:
  - containerName: api
    language: javascript
    runtimeVersion: 20.19.2
    secureExecutionMode: false
