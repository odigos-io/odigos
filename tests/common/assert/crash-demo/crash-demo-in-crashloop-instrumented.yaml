apiVersion: v1
kind: Pod
metadata:
  namespace: default
  labels:
    app: otel-crash-demo
status:
  phase: Running
  containerStatuses:
    - name: api
      state:
        waiting:
          reason: CrashLoopBackOff
      ready: false
      started: false
---
apiVersion: odigos.io/v1alpha1
kind: InstrumentationConfig
metadata:
  name: deployment-otel-crash-demo
  namespace: default
  (ownerReferences[?kind == 'Deployment' && name == 'otel-crash-demo']):
    - apiVersion: apps/v1
      kind: Deployment
      name: otel-crash-demo
  (ownerReferences[?kind == 'Source' && name == 'default']):
    - apiVersion: odigos.io/v1alpha1
      kind: Source
      name: default
spec:
  agentInjectionEnabled: true
  containers:
  - agentEnabled: true
    containerName: api
    otelDistroName: nodejs-community
  serviceName: otel-crash-demo
status:
  (status.rollbackOccurred || `false`): false
  runtimeDetailsByContainer:
  - containerName: api
    language: javascript
    runtimeVersion: 20.19.2
    secureExecutionMode: false
