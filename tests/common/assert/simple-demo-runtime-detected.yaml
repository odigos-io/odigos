apiVersion: odigos.io/v1alpha1
kind: InstrumentationConfig
metadata:
  name: deployment-coupon
  namespace: default
  (ownerReferences[?kind == 'Deployment' && name == 'coupon']):
    - apiVersion: apps/v1
      kind: Deployment
      name: coupon
  (ownerReferences[?kind == 'Source' && (name == 'default' || name == 'coupon')]):
    - apiVersion: odigos.io/v1alpha1
      kind: Source
status:
  runtimeDetailsByContainer:
    - containerName: coupon
      language: javascript
      runtimeVersion: 18.3.0
---
