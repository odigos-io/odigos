apiVersion: odigos.io/v1alpha1
kind: InstrumentationConfig
metadata:
  name: deployment-currency
  namespace: default
  (ownerReferences[?kind == 'Deployment' && name == 'currency']):
    - apiVersion: apps/v1
      kind: Deployment
      name: currency
  (ownerReferences[?kind == 'Source' && (name == 'default' || name == 'currency')]):
    - apiVersion: odigos.io/v1alpha1
      kind: Source
status:
  (runtimeDetailsByContainer[?containerName=='currency']):
    - language: php
      runtimeVersion: 8.2.29
      secureExecutionMode: false
  (runtimeDetailsByContainer[?containerName=='nginx']):
    - language: nginx
      secureExecutionMode: false
