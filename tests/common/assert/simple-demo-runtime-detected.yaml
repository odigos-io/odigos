apiVersion: odigos.io/v1alpha1
kind: InstrumentationConfig
metadata:
  name: deployment-inventory
  namespace: default
  (ownerReferences[?kind == 'Deployment' && name == 'inventory']):
    - apiVersion: apps/v1
      kind: Deployment
      name: inventory
  (ownerReferences[?kind == 'Source' && (name == 'default' || name == 'inventory')]):
    - apiVersion: odigos.io/v1alpha1
      kind: Source
status:
  runtimeDetailsByContainer:
    - containerName: inventory
      envFromContainerRuntime:
        - name: PYTHONPATH
          value: /app # this env exists in the test image
      language: python
      runtimeVersion: 3.11.15
